apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooker
  namespace: cooker
  labels:
    app.kubernetes.io/name: cooker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cooker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cooker
    spec:
      serviceAccountName: cooker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cooker
          image: ghcr.io/cooker-ci/cooker:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: COOKER_PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cooker-db
                  key: url
            - name: REDIS_URL
              value: "redis://cooker-redis:6379"
            - name: COOKER_K8S_IN_CLUSTER
              value: "true"
          # NOTE: This raw manifest deliberately does NOT mount the host
          # /var/run/docker.sock. The Helm chart only mounts it when
          # `builder.kind == "docker"`; this parity path defaults to
          # Kaniko / Buildah (one-shot Jobs, no host paths) — see
          # SECURITY.md "Image build isolation" and audit S26-05-04.
          # Operators who legitimately need the docker socket should
          # author a deliberate variant; do not re-add the mount here.
          volumeMounts:
            # Writable scratch for git clones / temp files since
            # readOnlyRootFilesystem makes everything else read-only.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
