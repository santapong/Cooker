apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooker
  namespace: cooker
  labels:
    app.kubernetes.io/name: cooker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cooker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cooker
    spec:
      serviceAccountName: cooker
      containers:
        - name: cooker
          image: ghcr.io/cooker-ci/cooker:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: COOKER_PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cooker-db
                  key: url
            - name: REDIS_URL
              value: "redis://cooker-redis:6379"
            - name: COOKER_K8S_IN_CLUSTER
              value: "true"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
