# Bundled PostgreSQL for the raw-manifest install path — parity with the
# Helm chart's postgresql.bundled StatefulSet (deploy/helm/cooker).
#
# Convenience for small / single-replica deployments. For production at
# scale use a managed Postgres or an operator, and point the cooker-db
# Secret's `url` at it instead.
#
# Before applying, create the two secrets this stack needs:
#
#   # DB password (referenced by the StatefulSet below) AND the app's
#   # DATABASE_URL (referenced by deployment.yaml, key "url"). Keep them
#   # consistent — same password in both.
#   PW="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
#   kubectl -n cooker create secret generic cooker-db \
#     --from-literal=password="$PW" \
#     --from-literal=url="postgres://cooker:${PW}@cooker-postgres:5432/cooker?sslmode=require"
#
# sslmode=require is mandatory because COOKER_ENV=production rejects a
# non-localhost DB host without TLS. This StatefulSet serves a self-signed
# cert (generated by an init container), which sslmode=require accepts
# without verification.
---
apiVersion: v1
kind: Service
metadata:
  name: cooker-postgres
  namespace: cooker
  labels:
    app.kubernetes.io/name: cooker-postgres
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cooker-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cooker-postgres
  namespace: cooker
  labels:
    app.kubernetes.io/name: cooker-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: cooker-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cooker-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cooker-postgres
        app.kubernetes.io/component: database
    spec:
      # fsGroup 70 = the alpine postgres group, so the generated TLS key
      # (mode 0600, written by the init container) is readable by the
      # postgres process, which refuses keys with group/world access.
      securityContext:
        fsGroup: 70
      initContainers:
        # Generate a self-signed cert into a shared emptyDir. Regenerated
        # on each pod start — fine for sslmode=require (no verification).
        - name: tls-init
          image: alpine:3.19
          command:
            - sh
            - -ec
            - |
              apk add --no-cache openssl >/dev/null
              openssl req -new -x509 -days 3650 -nodes -text \
                -subj "/CN=cooker-postgres" \
                -out /tls/server.crt -keyout /tls/server.key
              chown 70:70 /tls/server.crt /tls/server.key
              chmod 600 /tls/server.key
              chmod 644 /tls/server.crt
          volumeMounts:
            - name: tls
              mountPath: /tls
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/tls/server.crt
            - -c
            - ssl_key_file=/tls/server.key
          env:
            - name: POSTGRES_DB
              value: cooker
            - name: POSTGRES_USER
              value: cooker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cooker-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /tls
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cooker"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cooker"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tls
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
