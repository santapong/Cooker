# REQUIRES the Prometheus Operator (monitoring.coreos.com/v1 CRDs). If your
# cluster does not run the Operator, do NOT apply this file — scrape Cooker
# with a plain Prometheus static_config instead (see
# deploy/observability/README.md). `kubectl apply -f deploy/kubernetes/`
# will fail on this object when the CRD is absent.
#
# Scrapes the existing cooker Service's "http" port at /metrics. Metrics are
# only served when COOKER_METRICS_ENABLED=true (set in deployment.yaml).
#
# RECOMMENDED for ingress-exposed installs: serve /metrics on a dedicated
# internal port (see COOKER_METRICS_PORT in deployment.yaml + the "metrics"
# Service port in service.yaml). When you do, change the endpoint `port` below
# from "http" to "metrics" so this scrapes the internal-only port instead of
# the public app port. Chart equivalent: metrics.port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cooker
  namespace: cooker
  labels:
    app.kubernetes.io/name: cooker
    # Match this to your Prometheus Operator's serviceMonitorSelector
    # (kube-prometheus-stack commonly selects on `release: <stack-release>`).
    role: service-monitor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cooker
  endpoints:
    # Change to "metrics" when using a dedicated COOKER_METRICS_PORT (see header).
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - cooker
