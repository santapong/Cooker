# LIGHT edition preset — main features, minimal footprint.
#
#   helm upgrade --install cooker ./deploy/helm/cooker -f ./deploy/helm/cooker/values-light.yaml
#   (or `make deploy-k8s-light`)
#
# Single replica, bundled Postgres, NO Redis (in-memory ws/ticket/rate
# backends), jobqueue/scheduler/metrics/tracing off, audit to stdout,
# local auth with autogenerated secrets. Core CI/CD loop (pipelines,
# runs, apps, environments, WebSockets) is always on — it has no toggle.
#
# Move to FULL in place with:
#   helm upgrade cooker ./deploy/helm/cooker -f ./deploy/helm/cooker/values-full.yaml

cookerEnv: production
replicaCount: 1

postgresql:
  enabled: true
  bundled: true
  sslMode: require

# No Redis sidecar; single-replica memory backends.
redis:
  enabled: false
  url: ""
wsHub:
  backend: memory
wsTicket:
  backend: memory
rateLimit:
  backend: memory

secretKey:
  autogenerate: true

localAuth:
  enabled: true
  autogenerate: true
  allowSignup: true

oidc:
  allowedOrigins: ["http://localhost:8080"]

builder:
  kind: noop

metrics:
  enabled: false

retention:
  enabled: false

# Feature knobs the chart doesn't first-class — via extraEnv.
extraEnv:
  - name: COOKER_JOBQUEUE_ENABLED
    value: "false"
  - name: COOKER_SCHEDULER_ENABLED
    value: "false"
  - name: COOKER_TRACING_ENABLED
    value: "false"
  - name: COOKER_AUDIT_DESTINATION
    value: "stdout"
