replicaCount: 1

# Pod termination grace period. Cooker drains in-flight HTTP
# requests for up to 30s and finishes tracked pipeline runs for
# up to 25s after that, so 60s leaves a small safety buffer.
terminationGracePeriodSeconds: 60

# Cooker runtime environment. Production gates strict defaults
# (deny-all CORS, fatal startup checks for missing SECRET_KEY).
# Dev / uat skip these. The chart defaults to "production"; flip
# this for a quick test cluster that hasn't been wired up with
# secrets yet.
cookerEnv: production

# AES-256 key for encrypting environment secrets at rest.
# Required when cookerEnv=production AND secrets backend is
# "database". When the keepsave backend is selected (see
# secrets.backend below), KeepSave manages encryption and this is
# unused. Either set secretKey.value inline (the chart will create
# a Secret holding it) OR point secretKey.existingSecret at a
# pre-created Kubernetes Secret with a "key" data field.
secretKey:
  existingSecret: ""    # name of a pre-created Secret
  existingSecretKey: "key"
  value: ""             # inline value (NOT recommended for production)

# Secrets backend selection. "database" keeps the historical
# AES-GCM + JSONB path; "keepsave" delegates storage to a
# KeepSave server (system of record). Switching does NOT
# auto-migrate existing secrets; plan a one-shot copy before
# flipping. See README §Secrets backends.
#
# When backend=keepsave the chart renders COOKER_SECRETS_KEEPSAVE_URL,
# _PROJECT_ID, and _API_KEY (the latter via secretKeyRef into a
# pre-created Secret). The Secret is operator-managed; the chart
# does not create it.
secrets:
  backend: database     # database | keepsave
  keepsave:
    url: ""             # http(s)://<keepsave-host>:<port>
    projectId: ""
    apiKey:
      existingSecret: ""    # name of a pre-created Secret
      existingSecretKey: "api-key"

# Cloud inventory & cost panel (OR-2). Read-only: Cooker lists compute
# instances, managed Kubernetes clusters, and container registries, plus
# month-to-date spend, across the enabled providers. Each provider is
# enabled independently and off by default.
#
# Credentials: prefer the platform identity (IRSA on EKS / Workload
# Identity on GKE) wired through serviceAccount.annotations — then NO key
# needs to live in a Secret. Static keys are supported as a fallback and
# are pulled via secretKeyRef from a pre-created Secret (operator-managed;
# the chart does not create it). Grant a read-only IAM policy
# (ec2/eks/ecr/ce:Describe*+List* on AWS; compute/container/
# artifactregistry viewer on GCP) — see SECURITY.md.
cloudInventory:
  # How long the server caches a fan-out before re-querying the cloud
  # APIs. AWS Cost Explorer is billed per request, so keep this coarse.
  # Empty uses the backend default (5m).
  cacheTTL: ""
  aws:
    enabled: false
    region: ""            # required when enabled (e.g. ap-southeast-1)
    # Optional static access key id (prefer IRSA — leave empty).
    accessKeyId: ""
    # Optional static secret access key, via a pre-created Secret.
    secretAccessKey:
      existingSecret: ""   # name of a pre-created Secret
      existingSecretKey: "secret-access-key"
  gcp:
    enabled: false
    projectId: ""          # required when enabled
    # Optional service-account key JSON, via a pre-created Secret
    # (prefer Workload Identity — leave empty).
    credentialsJson:
      existingSecret: ""   # name of a pre-created Secret
      existingSecretKey: "credentials.json"

image:
  repository: ghcr.io/santapong/cooker
  # IN-H4: do NOT leave this as "latest" in production. Pin to a specific
  # release tag (e.g. "v0.1.0") or a full digest
  # (e.g. "sha256:<64-hex-chars>"). The CI workflow tags images with the
  # git semver tag; GoReleaser sets appVersion in Chart.yaml on release.
  # Empty string ("") causes the chart to fall back to .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: cooker.example.com
      paths:
        - path: /
          pathType: Prefix
  # TLS at ingress is REQUIRED for OIDC: most IdPs reject non-HTTPS
  # redirect URIs. Provision the certificate with cert-manager (or
  # equivalent) and reference the resulting Secret here. Example:
  #   tls:
  #     - secretName: cooker-tls
  #       hosts:
  #         - cooker.example.com
  # See README §Deployment → TLS at ingress.
  tls: []
  annotations: {}
    # SECURITY: /metrics is unauthenticated (see the metrics: block). When the
    # Ingress is enabled with the default "/" prefix it is publicly routable.
    # Uncomment the snippet below (nginx ingress controller) to deny /metrics
    # externally while leaving the cluster-internal ServiceMonitor scrape intact:
    #   nginx.ingress.kubernetes.io/configuration-snippet: |
    #     location = /metrics { deny all; }

# Builder selection.
#   docker  — shells out to the local Docker daemon via the bind-
#             mounted host socket. Convenient on single-node test
#             clusters; gives the Cooker container root-equivalent
#             access to the host's Docker. NOT recommended for
#             production.
#   kaniko  — submits a Kubernetes Job that runs the Kaniko executor
#             in-cluster. No host docker.sock, no host root path.
#             Requires the Cooker pod and the Kaniko Job to share a
#             PVC for the build context (set via builder.kaniko.contextPVC).
#             RBAC objects (Role + RoleBinding) ship in
#             templates/rbac.yaml when this kind is selected.
#   buildah — submits a Kubernetes Job that runs Buildah (`buildah bud`)
#             in-cluster. Same shape as Kaniko but with full Dockerfile
#             feature parity (RUN --mount=type=cache, heredocs, etc).
#             Trade-off: rootless Buildah needs CAP_SETUID + CAP_SETGID,
#             so the build namespace must be PSA "baseline" or a custom
#             profile — "restricted" drops both. RBAC ships in
#             templates/rbac.yaml when this kind is selected.
#             See backend/internal/builder/buildah.go for the Job spec.
#   buildkit — stub; not yet wired. See backlog P9.1.
#   noop    — accept builds without doing anything (test only).
builder:
  # Production default is kaniko (in-cluster Job — no host docker.sock).
  # Switch to "docker" only on isolated single-node test hosts;
  # Config.Validate refuses production boot with kind=docker.
  kind: kaniko
  kaniko:
    # IN-H6: pin to a specific Kaniko release tag for reproducible builds.
    # "latest" is NOT recommended in production — a new Kaniko release
    # could change build behaviour or introduce regressions between deploys.
    # Check https://github.com/GoogleContainerTools/kaniko/releases for
    # the current stable tag.
    image: gcr.io/kaniko-project/executor:v1.23.2
    # Namespace the Job is created in. Cooker's ServiceAccount must
    # have Job + Pod RBAC here. Defaults to the release namespace.
    namespace: ""
    # ServiceAccount the Kaniko Job's pod runs as. Empty uses the
    # namespace default; production should reference a dedicated SA
    # with registry-credential mounts.
    serviceAccount: ""
    # PVC mounted at the build-context path on both Cooker and the
    # Kaniko Job. Operators stage source there before invoking the
    # builder. Empty falls back to emptyDir which won't see Cooker's
    # source — only useful for chart smoke tests.
    contextPVC: ""
  buildah:
    # IN-H6: pin to a specific Buildah release tag for reproducible builds.
    # "stable" and "latest" float and can silently change between deploys.
    # Check https://quay.io/repository/buildah/buildah?tab=tags for the
    # current stable release tag.
    image: quay.io/buildah/buildah:v1.38.0
    # Namespace the Job is created in. Defaults to the release
    # namespace. Must be PSA "baseline" (or a custom profile that
    # permits CAP_SETUID + CAP_SETGID); "restricted" drops both and
    # the rootless user-namespace setup will fail.
    namespace: ""
    # ServiceAccount the Buildah Job's pod runs as. Empty uses the
    # namespace default.
    serviceAccount: ""
    # PVC mounted at the build-context path on both Cooker and the
    # Buildah Job. Same semantics as builder.kaniko.contextPVC.
    contextPVC: ""
    # Storage driver. "vfs" works without kernel modules; "overlay"
    # is faster but needs fuse-overlayfs on the nodes. Default vfs
    # for portability.
    storageDriver: vfs
  # Registry layer cache for app-deploy synthesized builds. When
  # enabled, Cooker stamps cache.mode=registry + this ref onto every
  # synthesized build stage (Kaniko --cache-repo / Buildah --cache-to /
  # BuildKit cache exports). The builder's ServiceAccount needs push
  # access to the ref. Hand-built pipelines configure cache per stage
  # in the editor instead. See docs/build-cache.md.
  cache:
    enabled: false
    ref: ""

# Host-Docker access. Used only when builder.kind=docker; the
# templates skip rendering the volume + mount otherwise.
docker:
  enabled: true
  socketPath: /var/run/docker.sock

# WebSocket broadcast fan-out. "redis" lets multiple Cooker replicas
# share a pub/sub topic so a broadcast on replica A reaches a client
# on replica B. "memory" is per-process — fine for replicaCount=1.
wsHub:
  backend: redis

# WebSocket single-use ticket store. Mirrors wsHub semantics: redis
# for multi-replica, memory for single-replica.
wsTicket:
  backend: redis

# Per-user rate limit storage. redis is multi-replica safe via the
# go-redis/redis_rate GCRA limiter.
rateLimit:
  backend: redis

# Sticky sessions at ingress. Set true if your ingress is configured
# to pin a client to one replica; lets Validate accept memory backends
# above with replicaCount > 1 (not recommended in prod — Redis is the
# better answer).
stickySessions: false

# Redis connection. Required when any of {wsHub, wsTicket, rateLimit}
# is set to "redis". Override when using an external Redis.
# enabled: set false to skip deploying a Redis sidecar and manage your
# own Redis instance externally (update url to point at it).
redis:
  enabled: true
  url: "redis://cooker-redis:6379"

# Kubernetes access
kubernetes:
  inCluster: true

# OIDC/SSO Authentication
#
# Two ways to provide the client secret in production:
# 1. Set oidc.clientSecretRef.{name,key} pointing at a pre-existing
#    Kubernetes Secret. Recommended for production — keeps the secret
#    out of values.yaml and the chart artifact.
# 2. Set oidc.clientSecret inline. The chart creates a Secret named
#    {release}-oidc holding it, and the Deployment references it via
#    secretKeyRef. Convenient for dev/test; not recommended for prod.
#
# scopes / allowedOrigins are exposed because they vary per IdP and
# per ingress hostname.
oidc:
  enabled: false
  issuerUrl: ""
  clientId: ""
  redirectUrl: ""
  # Scopes requested from the IdP. groups is required for RBAC.
  scopes: ["openid", "profile", "email", "groups"]
  # CORS allowlist for the API. Production must set this; the
  # backend fails fast on empty allowedOrigins when cookerEnv=production.
  allowedOrigins: []
  # Reference to a pre-existing Kubernetes Secret (production path).
  clientSecretRef:
    name: ""
    key: "client-secret"
  # Inline value (creates a chart-managed Secret). NOT for production.
  clientSecret: ""
  # Optional CSV of "group:role" pairs overriding the default mapping.
  # Empty falls back to cooker-admins/cooker-operators/cooker-approvers/
  # cooker-viewers. Example:
  #   "platform-admins:admin,platform-eng:operator,security-team:approver"
  groupRoleMap: ""
  # Optional CSV of ACR values that satisfy the step-up MFA gate
  # applied to admin destructive routes (DELETE pipelines/envs/apps,
  # secret reveal/put/delete/promote, app webhook rotation). Empty
  # disables the gate. Example:
  #   "mfa,urn:mace:incommon:iap:silver"
  mfaAcrValues: ""

# Database
#
# When database.host is set, the chart renders a DATABASE_URL env var
# of the form
#   postgres://<username>:$(DB_PASSWORD)@<host>:<port>/<name>?sslmode=<sslMode>
# and pulls DB_PASSWORD from the referenced Secret.
#
# When database.host is empty (default), the chart does NOT render
# DATABASE_URL — operators are expected to set it via extraEnv or a
# pod-spec override (preserving the historical behaviour).
database:
  host: ""              # e.g. postgres.cooker.svc.cluster.local
  port: 5432
  name: cooker
  username: cooker
  passwordSecretRef:
    name: ""            # name of a pre-created Secret containing the DB password
    key: "password"

postgresql:
  enabled: true
  # NOTE: no default `auth.password` is shipped (S26-05-13). The
  # previous default was the literal string "cooker"; operators who
  # `helm install`d without an override inherited a publicly-documented
  # credential. Operators must now provision a Kubernetes Secret and
  # reference it via `database.passwordSecretRef.name` (see the
  # `database:` block above) — the chart fails closed via a `required`
  # guard in `templates/_helpers.tpl` if `database.host` is set without
  # a password reference. The `auth.{database,username}` keys are kept
  # for forward-compatibility with a future bundled bitnami/postgresql
  # subchart; `password` is intentionally absent.
  auth:
    database: cooker
    username: cooker
  # SSL/TLS to PostgreSQL. The chart appends ?sslmode=<value> to the
  # DATABASE_URL it constructs from the database.* block above.
  # Production should use "require" at minimum; "verify-full" when a
  # CA bundle is mounted into the Cooker pod and the operator has
  # provisioned a CA-signed PostgreSQL cert.
  #
  # Possible values: disable | allow | prefer | require | verify-ca | verify-full
  sslMode: require

# RBAC
serviceAccount:
  create: true
  name: cooker
  # Annotations to add to the ServiceAccount. Useful for IRSA on EKS
  # (Workload Identity on GKE, Workload Identity on AKS, etc.).
  # Example:
  #   annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/cooker
  annotations: {}
rbac:
  create: true
  clusterWide: true

# Additional environment variables injected into the Cooker container
# AFTER the chart-managed env vars. Kubernetes uses the FIRST occurrence
# of a duplicated env name in the list, so chart-managed vars (COOKER_ENV,
# COOKER_SECRET_KEY, REDIS_URL, etc.) cannot be overridden via extraEnv —
# use the dedicated chart values for those. Use extraEnv for vars the chart
# does not model as first-class values, e.g.:
#
#   extraEnv:
#     # Literal value
#     - name: COOKER_SECRETS_BACKEND
#       value: aws
#     # Value from a Kubernetes Secret
#     - name: AWS_ROLE_ARN
#       valueFrom:
#         secretKeyRef:
#           name: cooker-aws-creds
#           key: role-arn
extraEnv: []

# Additional envFrom sources (ConfigMap or Secret) injected into the
# Cooker container. Applied AFTER chart-managed env vars; the same
# first-occurrence rule applies — chart-managed vars win over any key
# that collides from an envFrom source. Example:
#
#   extraEnvFrom:
#     # All keys from a Secret mounted as env vars
#     - secretRef:
#         name: cooker-aws-env
#     # All keys from a ConfigMap mounted as env vars
#     - configMapRef:
#         name: cooker-feature-flags
extraEnvFrom: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Liveness, readiness, and startup probe tuning. Defaults are deliberately
# generous — Cooker performs an OIDC discovery + Postgres ping +
# embedded migration on first boot and can take several seconds to
# answer /health/ready under cold-cache conditions. Tighten these
# in production once you've measured your own boot time.
#
# startupProbe: gives the binary up to (failureThreshold × periodSeconds)
# = 300s to pass its first liveness check before Kubernetes applies the
# liveness failureThreshold. This covers cold-boot without requiring an
# inflated initialDelaySeconds on the liveness probe.
probes:
  startup:
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1

# Horizontal Pod Autoscaler. Disabled by default; enable when
# replicaCount > 1 and CPU is the right scaling signal for your
# traffic shape. Anything that uses memory in-process state (the
# in-memory rate limiter / WS ticket store) needs the redis
# backends configured before HPA makes sense.
#
# M (HPA/PDB coupling): ALWAYS enable pdb.enabled=true alongside
# hpa.enabled=true. Without a PodDisruptionBudget, a node drain
# can evict every replica simultaneously while HPA is scaling —
# leaving zero available pods and taking down the service.
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Pod Disruption Budget. Recommended whenever replicaCount > 1 so
# kubectl drain / node maintenance can't evict every replica at
# once. minAvailable is the floor the cluster must keep up.
# NOTE: enable this whenever hpa.enabled=true (see HPA note above).
pdb:
  enabled: false
  minAvailable: 1

# Pod-level + container-level security hardening. Defaults to the
# strict profile that satisfies Kubernetes Pod Security Admission
# "restricted" (runAsNonRoot, drop all caps, no privilege escalation,
# read-only root filesystem). Disable with securityContext.enabled=false
# for clusters that haven't been configured for this yet.
securityContext:
  enabled: true
  # Standard "nonroot" UID/GID — matches the user baked into the
  # Dockerfile (deploy/docker/Dockerfile).
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# Pipeline-runs retention. Off by default. When enabled (and
# database.host is set so the chart renders DATABASE_URL), this
# renders a CronJob that runs `psql` against the same Postgres and
# deletes pipeline_runs rows whose finished_at is older than
# daysToKeep. Closes the launch-readiness "pipeline_runs grows
# without bound" item without putting the DELETE path inside the
# request-serving binary.
#
# The Job is gated on `database.host` because the chart only renders
# DATABASE_URL when an in-chart Postgres reference is provided; if
# you point Cooker at an external Postgres via extraEnv, write your
# own retention job — this template can't see your DATABASE_URL.
retention:
  enabled: false
  schedule: "0 2 * * *"   # 02:00 UTC daily
  daysToKeep: 90
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Prometheus metrics. The /metrics endpoint is served on the HTTP port
# (service.port) when COOKER_METRICS_ENABLED=true. The chart sets that env
# var from metrics.enabled below.
#
# metrics.enabled defaults to TRUE so a default install always exposes
# /metrics (closes the "deployed but no metrics" footgun; the Go binary's
# own default is false). The two CRD sub-toggles default to FALSE so a
# default install never references the Prometheus-Operator CRDs
# (monitoring.coreos.com/v1), which are absent on a fresh cluster. Flip
# them on once the Operator is installed.
# SECURITY: /metrics is served UNAUTHENTICATED on the public app port
# (8080) — see backend/internal/server/server.go. With the default install
# (ingress.enabled=false → ClusterIP only) this is safe: the endpoint is
# reachable only inside the cluster. The secure scrape path is the
# cluster-internal Service via the Prometheus Operator ServiceMonitor
# (serviceMonitor.enabled=true), which never leaves the cluster network.
#
# WARNING: if you enable the Ingress (ingress.enabled=true with the default
# "/" prefix), /metrics becomes PUBLICLY ROUTABLE with no authentication.
# Block it at the ingress — see the configuration-snippet example in the
# `ingress.annotations` block below. The permanent fix is metrics.port below.
metrics:
  enabled: true
  # Dedicated internal metrics port (RECOMMENDED for ingress-exposed installs).
  #
  #   0 (default) — back-compat: /metrics is served on the main app port
  #                 (service.port / 8080) alongside the API and UI. With
  #                 ingress.enabled=false this is cluster-internal and safe;
  #                 with the Ingress on the default "/" prefix it is publicly
  #                 routable (see the WARNING above).
  #   >0          — the backend serves /metrics ONLY on this separate internal
  #                 container port (COOKER_METRICS_PORT) and NOT on the main
  #                 app port. The chart exposes a named "metrics" containerPort
  #                 + Service port for it, and the ServiceMonitor scrapes that
  #                 port. The port is cluster-internal only — it is never wired
  #                 into the Ingress, so /metrics stays off the public "/" path
  #                 without needing an ingress deny-rule. Pick any free port,
  #                 e.g. 9090.
  port: 0
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels (e.g. the Operator's release selector). Example:
    #   labels:
    #     release: kube-prometheus-stack
    labels: {}
  prometheusRule:
    enabled: false
    # Extra labels to match your Prometheus' ruleSelector. Example:
    #   labels:
    #     role: alert-rules
    labels: {}

# NetworkPolicy that restricts ingress to port 8080 from any pod in
# the same namespace and (optionally) ingress controllers, plus egress
# to DNS / Postgres / Redis / OCI registries / Kubernetes API. Disable
# for clusters that don't run a CNI with NetworkPolicy enforcement.
networkPolicy:
  enabled: true
  # Optional: namespace label on the ingress controller. When set, the
  # NetworkPolicy allows traffic from that namespace specifically;
  # otherwise it allows from any pod.
  ingressNamespaceLabel: ""
  # Egress targets — Postgres + Redis chart names, registry CIDRs.
  postgresPort: 5432
  redisPort: 6379
