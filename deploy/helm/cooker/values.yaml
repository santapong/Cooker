replicaCount: 1

# Pod termination grace period. Cooker drains in-flight HTTP
# requests for up to 30s and finishes tracked pipeline runs for
# up to 25s after that, so 60s leaves a small safety buffer.
terminationGracePeriodSeconds: 60

# Cooker runtime environment. Production gates strict defaults
# (deny-all CORS, fatal startup checks for missing SECRET_KEY).
# Dev / uat skip these. The chart defaults to "production"; flip
# this for a quick test cluster that hasn't been wired up with
# secrets yet.
cookerEnv: production

# AES-256 key for encrypting environment secrets at rest.
# Required when cookerEnv=production AND secrets backend is
# "database". When the keepsave backend is selected (see
# secrets.backend below), KeepSave manages encryption and this is
# unused. Either set secretKey.value inline (the chart will create
# a Secret holding it) OR point secretKey.existingSecret at a
# pre-created Kubernetes Secret with a "key" data field.
secretKey:
  existingSecret: ""    # name of a pre-created Secret
  existingSecretKey: "key"
  value: ""             # inline value (NOT recommended for production)

# Secrets backend selection. "database" keeps the historical
# AES-GCM + JSONB path; "keepsave" delegates storage to a
# KeepSave server (system of record). Switching does NOT
# auto-migrate existing secrets; plan a one-shot copy before
# flipping. See README §Secrets backends.
#
# When backend=keepsave the chart renders COOKER_SECRETS_KEEPSAVE_URL,
# _PROJECT_ID, and _API_KEY (the latter via secretKeyRef into a
# pre-created Secret). The Secret is operator-managed; the chart
# does not create it.
secrets:
  backend: database     # database | keepsave
  keepsave:
    url: ""             # http(s)://<keepsave-host>:<port>
    projectId: ""
    apiKey:
      existingSecret: ""    # name of a pre-created Secret
      existingSecretKey: "api-key"

image:
  repository: ghcr.io/cooker-ci/cooker
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: cooker.example.com
      paths:
        - path: /
          pathType: Prefix
  # TLS at ingress is REQUIRED for OIDC: most IdPs reject non-HTTPS
  # redirect URIs. Provision the certificate with cert-manager (or
  # equivalent) and reference the resulting Secret here. Example:
  #   tls:
  #     - secretName: cooker-tls
  #       hosts:
  #         - cooker.example.com
  # See README §Deployment → TLS at ingress.
  tls: []
  annotations: {}

# Builder selection.
#   docker  — shells out to the local Docker daemon via the bind-
#             mounted host socket. Convenient on single-node test
#             clusters; gives the Cooker container root-equivalent
#             access to the host's Docker. NOT recommended for
#             production.
#   kaniko  — submits a Kubernetes Job that runs the Kaniko executor
#             in-cluster. No host docker.sock, no host root path.
#             Requires the Cooker pod and the Kaniko Job to share a
#             PVC for the build context (set via builder.kaniko.contextPVC).
#             RBAC objects (Role + RoleBinding) ship in
#             templates/rbac.yaml when this kind is selected.
#   buildkit — stub; not yet wired. See backlog P9.1.
#   noop    — accept builds without doing anything (test only).
builder:
  # Production default is kaniko (in-cluster Job — no host docker.sock).
  # Switch to "docker" only on isolated single-node test hosts;
  # Config.Validate refuses production boot with kind=docker.
  kind: kaniko
  kaniko:
    # Kaniko executor image. Pin to a known version for reproducible
    # builds; "latest" is documented but not recommended in production.
    image: gcr.io/kaniko-project/executor:latest
    # Namespace the Job is created in. Cooker's ServiceAccount must
    # have Job + Pod RBAC here. Defaults to the release namespace.
    namespace: ""
    # ServiceAccount the Kaniko Job's pod runs as. Empty uses the
    # namespace default; production should reference a dedicated SA
    # with registry-credential mounts.
    serviceAccount: ""
    # PVC mounted at the build-context path on both Cooker and the
    # Kaniko Job. Operators stage source there before invoking the
    # builder. Empty falls back to emptyDir which won't see Cooker's
    # source — only useful for chart smoke tests.
    contextPVC: ""

# Host-Docker access. Used only when builder.kind=docker; the
# templates skip rendering the volume + mount otherwise.
docker:
  enabled: true
  socketPath: /var/run/docker.sock

# WebSocket broadcast fan-out. "redis" lets multiple Cooker replicas
# share a pub/sub topic so a broadcast on replica A reaches a client
# on replica B. "memory" is per-process — fine for replicaCount=1.
wsHub:
  backend: redis

# WebSocket single-use ticket store. Mirrors wsHub semantics: redis
# for multi-replica, memory for single-replica.
wsTicket:
  backend: redis

# Per-user rate limit storage. redis is multi-replica safe via the
# go-redis/redis_rate GCRA limiter.
rateLimit:
  backend: redis

# Sticky sessions at ingress. Set true if your ingress is configured
# to pin a client to one replica; lets Validate accept memory backends
# above with replicaCount > 1 (not recommended in prod — Redis is the
# better answer).
stickySessions: false

# Redis connection. Required when any of {wsHub, wsTicket, rateLimit}
# is set to "redis". Override when using an external Redis.
redis:
  url: "redis://cooker-redis:6379"

# Kubernetes access
kubernetes:
  inCluster: true

# OIDC/SSO Authentication
#
# Two ways to provide the client secret in production:
# 1. Set oidc.clientSecretRef.{name,key} pointing at a pre-existing
#    Kubernetes Secret. Recommended for production — keeps the secret
#    out of values.yaml and the chart artifact.
# 2. Set oidc.clientSecret inline. The chart creates a Secret named
#    {release}-oidc holding it, and the Deployment references it via
#    secretKeyRef. Convenient for dev/test; not recommended for prod.
#
# scopes / allowedOrigins are exposed because they vary per IdP and
# per ingress hostname.
oidc:
  enabled: false
  issuerUrl: ""
  clientId: ""
  redirectUrl: ""
  # Scopes requested from the IdP. groups is required for RBAC.
  scopes: ["openid", "profile", "email", "groups"]
  # CORS allowlist for the API. Production must set this; the
  # backend fails fast on empty allowedOrigins when cookerEnv=production.
  allowedOrigins: []
  # Reference to a pre-existing Kubernetes Secret (production path).
  clientSecretRef:
    name: ""
    key: "client-secret"
  # Inline value (creates a chart-managed Secret). NOT for production.
  clientSecret: ""
  # Optional CSV of "group:role" pairs overriding the default mapping.
  # Empty falls back to cooker-admins/cooker-operators/cooker-approvers/
  # cooker-viewers. Example:
  #   "platform-admins:admin,platform-eng:operator,security-team:approver"
  groupRoleMap: ""
  # Optional CSV of ACR values that satisfy the step-up MFA gate
  # applied to admin destructive routes (DELETE pipelines/envs/apps,
  # secret reveal/put/delete/promote, app webhook rotation). Empty
  # disables the gate. Example:
  #   "mfa,urn:mace:incommon:iap:silver"
  mfaAcrValues: ""

# Database
#
# When database.host is set, the chart renders a DATABASE_URL env var
# of the form
#   postgres://<username>:$(DB_PASSWORD)@<host>:<port>/<name>?sslmode=<sslMode>
# and pulls DB_PASSWORD from the referenced Secret.
#
# When database.host is empty (default), the chart does NOT render
# DATABASE_URL — operators are expected to set it via extraEnv or a
# pod-spec override (preserving the historical behaviour).
database:
  host: ""              # e.g. postgres.cooker.svc.cluster.local
  port: 5432
  name: cooker
  username: cooker
  passwordSecretRef:
    name: ""            # name of a pre-created Secret containing the DB password
    key: "password"

postgresql:
  enabled: true
  auth:
    database: cooker
    username: cooker
    password: cooker
  # SSL/TLS to PostgreSQL. The chart appends ?sslmode=<value> to the
  # DATABASE_URL it constructs from the database.* block above.
  # Production should use "require" at minimum; "verify-full" when a
  # CA bundle is mounted into the Cooker pod and the operator has
  # provisioned a CA-signed PostgreSQL cert.
  #
  # Possible values: disable | allow | prefer | require | verify-ca | verify-full
  sslMode: require

# Cache
redis:
  enabled: true

# RBAC
serviceAccount:
  create: true
  name: cooker
rbac:
  create: true
  clusterWide: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod-level + container-level security hardening. Defaults to the
# strict profile that satisfies Kubernetes Pod Security Admission
# "restricted" (runAsNonRoot, drop all caps, no privilege escalation,
# read-only root filesystem). Disable with securityContext.enabled=false
# for clusters that haven't been configured for this yet.
securityContext:
  enabled: true
  # Standard "nonroot" UID/GID — matches the user baked into the
  # Dockerfile (deploy/docker/Dockerfile).
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# NetworkPolicy that restricts ingress to port 8080 from any pod in
# the same namespace and (optionally) ingress controllers, plus egress
# to DNS / Postgres / Redis / OCI registries / Kubernetes API. Disable
# for clusters that don't run a CNI with NetworkPolicy enforcement.
networkPolicy:
  enabled: true
  # Optional: namespace label on the ingress controller. When set, the
  # NetworkPolicy allows traffic from that namespace specifically;
  # otherwise it allows from any pod.
  ingressNamespaceLabel: ""
  # Egress targets — Postgres + Redis chart names, registry CIDRs.
  postgresPort: 5432
  redisPort: 6379
