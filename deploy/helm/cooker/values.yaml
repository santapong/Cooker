replicaCount: 1

# Cooker runtime environment. Production gates strict defaults
# (deny-all CORS, fatal startup checks for missing SECRET_KEY).
# Dev / uat skip these. The chart defaults to "production"; flip
# this for a quick test cluster that hasn't been wired up with
# secrets yet.
cookerEnv: production

# AES-256 key for encrypting environment secrets at rest.
# Required when cookerEnv=production AND secrets backend is
# "database". When the keepsave backend is selected (see
# secrets.backend below), KeepSave manages encryption and this is
# unused. Either set secretKey.value inline (the chart will create
# a Secret holding it) OR point secretKey.existingSecret at a
# pre-created Kubernetes Secret with a "key" data field.
secretKey:
  existingSecret: ""    # name of a pre-created Secret
  existingSecretKey: "key"
  value: ""             # inline value (NOT recommended for production)

# Secrets backend selection. "database" keeps the historical
# AES-GCM + JSONB path; "keepsave" delegates storage to a
# KeepSave server (system of record). Switching does NOT
# auto-migrate existing secrets; plan a one-shot copy before
# flipping. See README §Secrets backends.
#
# Note: for backend=keepsave the Helm template wiring (env-var
# rendering + secretKeyRef for the API key) is a follow-up; today
# operators set the env vars directly via extraEnv or pod-spec
# overrides. Tracked in backlog P2.1 follow-ups.
secrets:
  backend: database     # database | keepsave
  keepsave:
    url: ""             # http(s)://<keepsave-host>:<port>
    projectId: ""
    apiKey:
      existingSecret: ""    # name of a pre-created Secret
      existingSecretKey: "api-key"

image:
  repository: ghcr.io/cooker-ci/cooker
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: cooker.example.com
      paths:
        - path: /
          pathType: Prefix
  # TLS at ingress is REQUIRED for OIDC: most IdPs reject non-HTTPS
  # redirect URIs. Provision the certificate with cert-manager (or
  # equivalent) and reference the resulting Secret here. Example:
  #   tls:
  #     - secretName: cooker-tls
  #       hosts:
  #         - cooker.example.com
  # See README §Deployment → TLS at ingress.
  tls: []
  annotations: {}

# Docker socket access (for local Docker management). Production
# should switch to Kaniko (in-cluster, rootless) — tracked in
# backlog P1.1.
docker:
  enabled: true
  socketPath: /var/run/docker.sock

# Kubernetes access
kubernetes:
  inCluster: true

# OIDC/SSO Authentication
#
# Two ways to provide the client secret in production:
# 1. Set oidc.clientSecretRef.{name,key} pointing at a pre-existing
#    Kubernetes Secret. Recommended for production — keeps the secret
#    out of values.yaml and the chart artifact.
# 2. Set oidc.clientSecret inline. The chart creates a Secret named
#    {release}-oidc holding it, and the Deployment references it via
#    secretKeyRef. Convenient for dev/test; not recommended for prod.
#
# scopes / allowedOrigins are exposed because they vary per IdP and
# per ingress hostname.
oidc:
  enabled: false
  issuerUrl: ""
  clientId: ""
  redirectUrl: ""
  # Scopes requested from the IdP. groups is required for RBAC.
  scopes: ["openid", "profile", "email", "groups"]
  # CORS allowlist for the API. Production must set this; the
  # backend fails fast on empty allowedOrigins when cookerEnv=production.
  allowedOrigins: []
  # Reference to a pre-existing Kubernetes Secret (production path).
  clientSecretRef:
    name: ""
    key: "client-secret"
  # Inline value (creates a chart-managed Secret). NOT for production.
  clientSecret: ""

# Database
postgresql:
  enabled: true
  auth:
    database: cooker
    username: cooker
    password: cooker
  # SSL/TLS to PostgreSQL. Cooker appends ?sslmode=<value> to the
  # DATABASE_URL it builds. Production should use "require" at
  # minimum; "verify-full" when a CA bundle is mounted into the
  # Cooker pod and the operator has provisioned a CA-signed
  # PostgreSQL cert.
  #
  # Possible values: disable | allow | prefer | require | verify-ca | verify-full
  #
  # Note: chart-side rendering of this value into the constructed
  # DATABASE_URL is a follow-up; today operators set sslmode via the
  # full DATABASE_URL override or via the bitnami/postgresql
  # subchart's tls block. Tracked in backlog P1.4.
  sslMode: require

# Cache
redis:
  enabled: true

# RBAC
serviceAccount:
  create: true
  name: cooker
rbac:
  create: true
  clusterWide: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod-level + container-level security hardening. Defaults to the
# strict profile that satisfies Kubernetes Pod Security Admission
# "restricted" (runAsNonRoot, drop all caps, no privilege escalation,
# read-only root filesystem). Disable with securityContext.enabled=false
# for clusters that haven't been configured for this yet.
securityContext:
  enabled: true
  # Standard "nonroot" UID/GID — matches the user baked into the
  # Dockerfile (deploy/docker/Dockerfile).
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# NetworkPolicy that restricts ingress to port 8080 from any pod in
# the same namespace and (optionally) ingress controllers, plus egress
# to DNS / Postgres / Redis / OCI registries / Kubernetes API. Disable
# for clusters that don't run a CNI with NetworkPolicy enforcement.
networkPolicy:
  enabled: true
  # Optional: namespace label on the ingress controller. When set, the
  # NetworkPolicy allows traffic from that namespace specifically;
  # otherwise it allows from any pod.
  ingressNamespaceLabel: ""
  # Egress targets — Postgres + Redis chart names, registry CIDRs.
  postgresPort: 5432
  redisPort: 6379
