{{- /*
  Chart-managed Secret for COOKER_LOCAL_AUTH_JWT_SIGNING_KEY.

  Rendered when local auth is enabled with autogenerate=true, an inline
  jwtSigningKey, and no existingSecret. When autogenerate is on and no
  inline value is given, the chart generates a 32-byte key (base64) once
  and persists it across upgrades via lookup, so tokens issued before an
  upgrade stay valid.

  Production: pre-create the Secret and set localAuth.existingSecret, or
  provide localAuth.jwtSigningKey from a values file kept out of the
  chart artifact.
*/}}
{{- if and .Values.localAuth.enabled (not .Values.localAuth.existingSecret) }}
{{- $name := printf "%s-local-auth" (include "cooker.fullname" .) }}
{{- $key := .Values.localAuth.jwtSigningKey }}
{{- if not $key }}
{{- if .Values.localAuth.autogenerate }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (index $existing.data "jwt-signing-key") }}
{{- $key = index $existing.data "jwt-signing-key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 32 | b64enc }}
{{- end }}
{{- else }}
{{- fail "localAuth.enabled=true requires one of: localAuth.jwtSigningKey, localAuth.existingSecret, or localAuth.autogenerate=true" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cooker.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-signing-key: {{ $key | quote }}
{{- end }}
