{{- /*
  Chart-managed Secret for COOKER_SECRET_KEY (AES-256 key used to
  encrypt environment secrets at rest). Only rendered when the
  inline secretKey.value is set AND secretKey.existingSecret is empty.

  Production: pre-create the Secret out-of-band and set
  secretKey.existingSecret to its name. Do not put the key in
  values.yaml in plaintext.
*/}}
{{- if and .Values.secretKey.value (not .Values.secretKey.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cooker.fullname" . }}-secret-key
  labels:
    {{- include "cooker.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ .Values.secretKey.value | quote }}
{{- end }}
