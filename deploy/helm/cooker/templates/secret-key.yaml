{{- /*
  Chart-managed Secret for COOKER_SECRET_KEY (AES-256 key used to
  encrypt environment secrets at rest). Rendered when secretKey.value is
  set, OR secretKey.autogenerate=true, AND secretKey.existingSecret is
  empty. Autogenerate creates a base64 32-byte key once and persists it
  across upgrades via lookup — rotating it would make existing encrypted
  secrets undecryptable, so persistence matters.

  Production: pre-create the Secret out-of-band and set
  secretKey.existingSecret to its name. Do not put the key in
  values.yaml in plaintext.

  WARNING (GitOps / template flows): `helm template` and
  `helm install --dry-run` CANNOT run lookup — it always returns
  empty there, so every render mints a FRESH key. Applying such a
  render over a live release rotates COOKER_SECRET_KEY and makes all
  previously encrypted secrets undecryptable. If you render manifests
  outside `helm upgrade` (Argo CD, Flux, CI pipelines), you MUST set
  secretKey.existingSecret (or secretKey.value) instead of relying on
  autogenerate.
*/}}
{{- if and (or .Values.secretKey.value .Values.secretKey.autogenerate) (not .Values.secretKey.existingSecret) -}}
{{- $name := printf "%s-secret-key" (include "cooker.fullname" .) }}
{{- $value := .Values.secretKey.value }}
{{- if not $value }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (index $existing.data "key") }}
{{- $value = index $existing.data "key" | b64dec }}
{{- else }}
{{- $value = randAlphaNum 32 | b64enc }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cooker.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ $value | quote }}
{{- end }}
