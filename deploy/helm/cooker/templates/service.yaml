apiVersion: v1
kind: Service
metadata:
  name: {{ include "cooker.fullname" . }}
  labels:
    {{- include "cooker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if and .Values.metrics.enabled (gt (.Values.metrics.port | default 0 | int) 0) }}
    # Cluster-internal metrics port for the ServiceMonitor to scrape. This is
    # a ClusterIP Service port only; it is never referenced by the Ingress, so
    # /metrics stays off the public "/" path.
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "cooker.selectorLabels" . | nindent 4 }}
