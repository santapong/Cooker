apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cooker.fullname" . }}
  labels:
    {{- include "cooker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cooker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cooker.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "cooker.fullname" .) }}
      {{- end }}
      containers:
        - name: cooker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: COOKER_PORT
              value: {{ .Values.service.port | quote }}
            - name: COOKER_K8S_IN_CLUSTER
              value: {{ .Values.kubernetes.inCluster | quote }}
            - name: COOKER_OIDC_ENABLED
              value: {{ .Values.oidc.enabled | quote }}
            {{- if .Values.oidc.enabled }}
            - name: COOKER_OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            - name: COOKER_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            {{- end }}
          {{- if .Values.docker.enabled }}
          volumeMounts:
            - name: docker-socket
              mountPath: {{ .Values.docker.socketPath }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.docker.enabled }}
      volumes:
        - name: docker-socket
          hostPath:
            path: {{ .Values.docker.socketPath }}
            type: Socket
      {{- end }}
