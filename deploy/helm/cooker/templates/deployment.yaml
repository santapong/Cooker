apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cooker.fullname" . }}
  labels:
    {{- include "cooker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cooker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cooker.selectorLabels" . | nindent 8 }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "cooker.fullname" .) }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: cooker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.securityContext.enabled }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
            {{- if and .Values.metrics.enabled (gt (int .Values.metrics.port) 0) }}
            # Dedicated internal metrics port. /metrics is served ONLY here
            # (not on the app port), so it stays off the public "/" ingress.
            - containerPort: {{ .Values.metrics.port }}
              name: metrics
            {{- end }}
          env:
            - name: COOKER_ENV
              value: {{ .Values.cookerEnv | quote }}
            - name: COOKER_PORT
              value: {{ .Values.service.port | quote }}
            - name: COOKER_METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if and .Values.metrics.enabled (gt (int .Values.metrics.port) 0) }}
            # >0 makes the backend bind /metrics on this separate internal
            # port only; 0/unset keeps it on the main app port (back-compat).
            - name: COOKER_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
            - name: COOKER_K8S_IN_CLUSTER
              value: {{ .Values.kubernetes.inCluster | quote }}
            - name: COOKER_REPLICA_COUNT
              value: {{ .Values.replicaCount | quote }}
            - name: COOKER_STICKY_SESSIONS
              value: {{ .Values.stickySessions | default false | quote }}
            - name: COOKER_WS_HUB_BACKEND
              value: {{ .Values.wsHub.backend | default "memory" | quote }}
            - name: COOKER_WS_TICKET_BACKEND
              value: {{ .Values.wsTicket.backend | default "memory" | quote }}
            - name: COOKER_RATE_LIMIT_BACKEND
              value: {{ .Values.rateLimit.backend | default "memory" | quote }}
            {{- if .Values.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            - name: COOKER_BUILDER
              value: {{ .Values.builder.kind | quote }}
            {{- if and .Values.builder.cache .Values.builder.cache.enabled }}
            - name: COOKER_BUILD_CACHE_REPO
              value: {{ required "builder.cache.ref is required when builder.cache.enabled" .Values.builder.cache.ref | quote }}
            {{- end }}
            {{- if eq .Values.builder.kind "kaniko" }}
            - name: COOKER_K8S_NAMESPACE
              value: {{ .Values.builder.kaniko.namespace | default .Release.Namespace | quote }}
            - name: COOKER_KANIKO_IMAGE
              value: {{ .Values.builder.kaniko.image | quote }}
            {{- if .Values.builder.kaniko.serviceAccount }}
            - name: COOKER_KANIKO_SERVICE_ACCOUNT
              value: {{ .Values.builder.kaniko.serviceAccount | quote }}
            {{- end }}
            {{- if .Values.builder.kaniko.contextPVC }}
            - name: COOKER_KANIKO_CONTEXT_PVC
              value: {{ .Values.builder.kaniko.contextPVC | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.builder.kind "buildah" }}
            - name: COOKER_K8S_NAMESPACE
              value: {{ .Values.builder.buildah.namespace | default .Release.Namespace | quote }}
            - name: COOKER_BUILDAH_IMAGE
              value: {{ .Values.builder.buildah.image | quote }}
            {{- if .Values.builder.buildah.serviceAccount }}
            - name: COOKER_BUILDAH_SERVICE_ACCOUNT
              value: {{ .Values.builder.buildah.serviceAccount | quote }}
            {{- end }}
            {{- if .Values.builder.buildah.contextPVC }}
            - name: COOKER_BUILDAH_CONTEXT_PVC
              value: {{ .Values.builder.buildah.contextPVC | quote }}
            {{- end }}
            - name: COOKER_BUILDAH_STORAGE_DRIVER
              value: {{ .Values.builder.buildah.storageDriver | default "vfs" | quote }}
            {{- end }}
            {{- include "cooker.databaseUrlEnv" . | nindent 12 }}
            {{- if .Values.oidc.allowedOrigins }}
            - name: COOKER_ALLOWED_ORIGINS
              value: {{ join "," .Values.oidc.allowedOrigins | quote }}
            {{- end }}
            - name: COOKER_SECRETS_BACKEND
              value: {{ .Values.secrets.backend | quote }}
            {{- if eq .Values.secrets.backend "keepsave" }}
            - name: COOKER_SECRETS_KEEPSAVE_URL
              value: {{ .Values.secrets.keepsave.url | quote }}
            - name: COOKER_SECRETS_KEEPSAVE_PROJECT_ID
              value: {{ .Values.secrets.keepsave.projectId | quote }}
            - name: COOKER_SECRETS_KEEPSAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.keepsave.apiKey.existingSecret is required when secrets.backend=keepsave" .Values.secrets.keepsave.apiKey.existingSecret | quote }}
                  key: {{ .Values.secrets.keepsave.apiKey.existingSecretKey | quote }}
            {{- end }}
            {{- if .Values.cloudInventory.cacheTTL }}
            - name: COOKER_CLOUD_CACHE_TTL
              value: {{ .Values.cloudInventory.cacheTTL | quote }}
            {{- end }}
            {{- if .Values.cloudInventory.aws.enabled }}
            - name: COOKER_CLOUD_AWS_ENABLED
              value: "true"
            - name: COOKER_CLOUD_AWS_REGION
              value: {{ required "cloudInventory.aws.region is required when cloudInventory.aws.enabled" .Values.cloudInventory.aws.region | quote }}
            {{- if .Values.cloudInventory.aws.accessKeyId }}
            - name: COOKER_CLOUD_AWS_ACCESS_KEY_ID
              value: {{ .Values.cloudInventory.aws.accessKeyId | quote }}
            {{- end }}
            {{- if .Values.cloudInventory.aws.secretAccessKey.existingSecret }}
            # Static credentials are OPTIONAL: prefer IRSA (an IAM role
            # bound to the ServiceAccount via serviceAccount.annotations).
            # When provided, the secret access key comes from a
            # pre-created Secret, never values.yaml.
            - name: COOKER_CLOUD_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudInventory.aws.secretAccessKey.existingSecret | quote }}
                  key: {{ .Values.cloudInventory.aws.secretAccessKey.existingSecretKey | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.cloudInventory.gcp.enabled }}
            - name: COOKER_CLOUD_GCP_ENABLED
              value: "true"
            - name: COOKER_CLOUD_GCP_PROJECT_ID
              value: {{ required "cloudInventory.gcp.projectId is required when cloudInventory.gcp.enabled" .Values.cloudInventory.gcp.projectId | quote }}
            {{- if .Values.cloudInventory.gcp.credentialsJson.existingSecret }}
            # Optional: prefer Workload Identity (bind a GCP service
            # account to the ServiceAccount via serviceAccount.annotations).
            # When provided, the SA key JSON comes from a pre-created
            # Secret, never values.yaml.
            - name: COOKER_CLOUD_GCP_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudInventory.gcp.credentialsJson.existingSecret | quote }}
                  key: {{ .Values.cloudInventory.gcp.credentialsJson.existingSecretKey | quote }}
            {{- end }}
            {{- end }}
            - name: COOKER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secretKey.existingSecret }}
                  name: {{ .Values.secretKey.existingSecret | quote }}
                  key: {{ .Values.secretKey.existingSecretKey | quote }}
                  {{- else }}
                  name: {{ include "cooker.fullname" . }}-secret-key
                  key: key
                  {{- end }}
                  # optional: false (default). Force the Pod to fail
                  # creation if the Secret is missing, rather than
                  # booting silently with COOKER_SECRET_KEY="" and
                  # sidestepping production validation.
                  optional: false
            - name: COOKER_OIDC_ENABLED
              value: {{ .Values.oidc.enabled | quote }}
            {{- if .Values.oidc.enabled }}
            - name: COOKER_OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            - name: COOKER_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: COOKER_OIDC_REDIRECT_URL
              value: {{ .Values.oidc.redirectUrl | quote }}
            {{- if .Values.oidc.scopes }}
            - name: COOKER_OIDC_SCOPES
              value: {{ join "," .Values.oidc.scopes | quote }}
            {{- end }}
            {{- if .Values.oidc.groupRoleMap }}
            - name: COOKER_OIDC_GROUP_MAP
              value: {{ .Values.oidc.groupRoleMap | quote }}
            {{- end }}
            {{- if .Values.oidc.mfaAcrValues }}
            - name: COOKER_OIDC_MFA_ACR_VALUES
              value: {{ .Values.oidc.mfaAcrValues | quote }}
            {{- end }}
            {{- if or .Values.oidc.clientSecretRef.name .Values.oidc.clientSecret }}
            - name: COOKER_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.oidc.clientSecretRef.name }}
                  name: {{ .Values.oidc.clientSecretRef.name | quote }}
                  key: {{ .Values.oidc.clientSecretRef.key | quote }}
                  {{- else }}
                  name: {{ include "cooker.fullname" . }}-oidc
                  key: client-secret
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
          {{- if .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml .Values.extraEnvFrom | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if and .Values.docker.enabled (eq .Values.builder.kind "docker") }}
            - name: docker-socket
              mountPath: {{ .Values.docker.socketPath }}
            {{- end }}
            {{- if and (eq .Values.builder.kind "kaniko") .Values.builder.kaniko.contextPVC }}
            - name: build-context
              mountPath: /workspace/context
            {{- end }}
            {{- if and (eq .Values.builder.kind "buildah") .Values.builder.buildah.contextPVC }}
            - name: build-context
              mountPath: /workspace/context
            {{- end }}
            {{- if .Values.securityContext.enabled }}
            # readOnlyRootFilesystem requires writable scratch space.
            # /tmp is used by internal/source/github (os.MkdirTemp) for
            # repo clones; emptyDir keeps it ephemeral and pod-local.
            - name: tmp
              mountPath: /tmp
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if and .Values.docker.enabled (eq .Values.builder.kind "docker") }}
        - name: docker-socket
          hostPath:
            path: {{ .Values.docker.socketPath }}
            type: Socket
        {{- end }}
        {{- if and (eq .Values.builder.kind "kaniko") .Values.builder.kaniko.contextPVC }}
        - name: build-context
          persistentVolumeClaim:
            claimName: {{ .Values.builder.kaniko.contextPVC | quote }}
        {{- end }}
        {{- if and (eq .Values.builder.kind "buildah") .Values.builder.buildah.contextPVC }}
        - name: build-context
          persistentVolumeClaim:
            claimName: {{ .Values.builder.buildah.contextPVC | quote }}
        {{- end }}
        {{- if .Values.securityContext.enabled }}
        - name: tmp
          emptyDir: {}
        {{- end }}
