{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled -}}
# Prometheus Operator PrometheusRule. Gated behind metrics.enabled AND
# metrics.prometheusRule.enabled so a default install never references the
# monitoring.coreos.com CRDs. Mirrors the standalone rules in
# deploy/observability/prometheus/cooker-rules.yaml. The HTTP 5xx series is
# selected on the `status` label (status=~"5.."), NOT a `code` label —
# see backend/internal/observability/observability.go.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cooker.fullname" . }}
  labels:
    {{- include "cooker.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: cooker-resilience
      rules:
        - alert: CookerDBConnectionErrors
          expr: rate(cooker_db_connection_errors_total[5m]) > 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Cooker is failing to reach Postgres"
        - alert: CookerRedisConnectionErrors
          expr: rate(cooker_redis_connection_errors_total[5m]) > 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Cooker Redis backend (rate limit / WS ticket / WS hub) is erroring"
        - alert: CookerJWKSFetchFailures
          expr: rate(cooker_jwks_fetch_failures_total[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Cooker cannot reach the OIDC IdP for JWKS"
        - alert: CookerOrphanedRunsHigh
          expr: increase(cooker_pipeline_runs_orphaned_total[1h]) > 5
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Cooker swept >5 orphaned runs in the last hour"
    - name: cooker-http
      rules:
        - alert: CookerHTTP5xxRate
          expr: |
            sum(rate(cooker_http_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum(rate(cooker_http_requests_total[5m])), 1) > 0.05
          for: 10m
          labels:
            severity: page
          annotations:
            summary: "Cooker HTTP 5xx ratio above 5%"
        - alert: CookerReadinessFailing
          expr: |
            max by (namespace, pod) (
              kube_pod_status_ready{condition="true", pod=~"{{ include "cooker.fullname" . }}.*"}
            ) == 0
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Cooker pod failing readiness"
{{- end }}
