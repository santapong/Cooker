{{- /*
  Chart-managed Secret for the OIDC client secret. Only rendered
  when oidc.enabled=true AND oidc.clientSecret (inline) is set
  AND oidc.clientSecretRef.name is empty (i.e. user didn't point
  at their own pre-existing Secret).

  Production deployments should set oidc.clientSecretRef.name and
  manage the Secret out-of-band (sealed-secrets, external-secrets,
  vault-injector, etc.) instead of relying on this template.
*/}}
{{- if and .Values.oidc.enabled .Values.oidc.clientSecret (not .Values.oidc.clientSecretRef.name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cooker.fullname" . }}-oidc
  labels:
    {{- include "cooker.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
