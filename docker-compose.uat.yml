# Cooker UAT stack — self-contained.
#
# `make uat-up` brings this stack up on the cooker-uat compose
# network. Everything runs locally; no external services needed
# beyond the Docker daemon hosting the compose stack itself.
#
# Services:
#   postgres           persistence for Cooker (named volume pg-uat)
#   registry           CNCF Distribution; receives docker pushes
#   k3s                single-node Kubernetes; pulls from registry
#   kubeconfig-fixer   rewrites k3s kubeconfig 127.0.0.1 -> k3s
#   cooker             the app; talks to all of the above
#
# Teardown is `make uat-down` which removes all four named volumes,
# leaving no state on the host.

name: cooker-uat

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cooker
      POSTGRES_USER: cooker
      POSTGRES_PASSWORD: cooker  # UAT ONLY — do not copy to production
    volumes:
      - pg-uat:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cooker"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cooker-uat

  registry:
    image: registry:2
    environment:
      REGISTRY_HTTP_ADDR: :5000
    volumes:
      - registry-uat:/var/lib/registry
    ports:
      # Host-side :5001 for debugging (curl http://localhost:5001/v2/_catalog).
      # Internal compose DNS name stays "registry:5000" so Cooker pushes and
      # k3s pulls use the same string.
      - "5001:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cooker-uat

  k3s:
    image: rancher/k3s:v1.29.4-k3s1
    command:
      - server
      - --disable=traefik
      - --disable=servicelb
      - --tls-san=k3s
      - --tls-san=127.0.0.1
      - --write-kubeconfig-mode=0644
    # k3s-in-docker requirements. `cgroup: host` is the canonical
    # compose-spec key; combined with privileged + tmpfs this
    # matches Rancher's upstream docker-compose reference.
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_TOKEN: uat-token
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      - k3s-server:/var/lib/rancher/k3s
      - kubeconfig:/output
      - ./deploy/uat/registries.yaml:/etc/rancher/k3s/registries.yaml:ro
    ports:
      # Exposed for host-side kubectl debugging. Cooker itself
      # reaches the API via "k3s:6443" on the compose network.
      - "6443:6443"
    healthcheck:
      test: ["CMD-SHELL", "k3s kubectl get --raw=/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - cooker-uat

  kubeconfig-fixer:
    # One-shot helper: wait for k3s to emit its kubeconfig, rewrite
    # the server URL from the loopback (what k3s writes) to the
    # compose service name (what Cooker can resolve), then touch a
    # sentinel so downstream depends_on: service_healthy can gate
    # on the full chain.
    image: alpine:3.19
    command:
      - sh
      - -c
      - |
        set -e
        until [ -f /output/kubeconfig.yaml ]; do
          echo "waiting for k3s kubeconfig..."
          sleep 1
        done
        sed -i 's#https://127.0.0.1:6443#https://k3s:6443#' /output/kubeconfig.yaml
        touch /output/.ready
        echo "kubeconfig ready"
        # Keep the container running so its healthcheck stays true.
        tail -f /dev/null
    volumes:
      - kubeconfig:/output
    depends_on:
      k3s:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /output/.ready"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks:
      - cooker-uat

  cooker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      # Vite bakes VITE_* values into the static bundle at build time.
      # When OIDC is enabled, set these in .env.uat (see .env.uat.example).
      args:
        VITE_OIDC_ENABLED: ${VITE_OIDC_ENABLED:-false}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: cooker:uat
    environment:
      COOKER_ENV: uat
      DATABASE_URL: postgres://cooker:cooker@postgres:5432/cooker?sslmode=disable
      COOKER_PORT: "8080"
      COOKER_REGISTRY: registry:5000/cooker
      COOKER_BUILDER: docker
      COOKER_PUSHER: docker
      COOKER_DEPLOYER: kubectl
      KUBECONFIG: /etc/cooker/kube/kubeconfig.yaml
      # OIDC config is read from .env.uat (see .env.uat.example).
      # When COOKER_OIDC_ENABLED=false the backend injects a dev admin
      # user so pipeline/deploy tests can run without an IdP.
      COOKER_OIDC_ENABLED: ${COOKER_OIDC_ENABLED:-false}
      COOKER_OIDC_ISSUER_URL: ${COOKER_OIDC_ISSUER_URL:-}
      COOKER_OIDC_CLIENT_ID: ${COOKER_OIDC_CLIENT_ID:-}
      COOKER_OIDC_CLIENT_SECRET: ${COOKER_OIDC_CLIENT_SECRET:-}
      COOKER_OIDC_REDIRECT_URL: ${COOKER_OIDC_REDIRECT_URL:-http://localhost:8080/callback}
      COOKER_ALLOWED_ORIGINS: ${COOKER_ALLOWED_ORIGINS:-http://localhost:8080}
      # COOKER_SECRET_KEY is injected via .env.uat by `make uat-up`.
      COOKER_SECRET_KEY: ${COOKER_SECRET_KEY:-}
    volumes:
      # Host docker daemon — Cooker shells out to `docker build`
      # and `docker push`, both of which talk to the host's daemon
      # via this socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # Kubeconfig written by k3s, rewritten by kubeconfig-fixer.
      - kubeconfig:/etc/cooker/kube:ro
    # The container runs as UID/GID 65532 (cooker, non-root). The
    # bind-mounted docker.sock is owned by the host's docker group;
    # adding that GID as a supplementary group inside the container
    # lets the cooker user talk to the daemon without root. The
    # Makefile resolves DOCKER_GID from the host before running
    # `docker compose up`. Default 999 matches Debian/Ubuntu hosts.
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_healthy
      kubeconfig-fixer:
        condition: service_healthy
    networks:
      - cooker-uat

networks:
  cooker-uat:
    driver: bridge

volumes:
  pg-uat:
  registry-uat:
  k3s-server:
  kubeconfig:
