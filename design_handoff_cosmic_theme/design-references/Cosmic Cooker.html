<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cosmic Cooker — Galaxy Theme</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #06061a; }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }
  button { font-family: inherit; border: none; background: none; }

  @keyframes ccTwinkle { 0%, 100% { opacity: var(--o, 0.5); } 50% { opacity: 0.12; } }
  @keyframes ccHalo { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.12); opacity: 1; } }
  @keyframes ccSpin { to { transform: rotate(360deg); } }
  @keyframes ccPulse {
    0% { box-shadow: 0 0 0 0 rgba(255,180,84,0.5); }
    70% { box-shadow: 0 0 0 7px rgba(255,180,84,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,180,84,0); }
  }
  @keyframes ccShimmer { 0% { transform: translateX(-120%); } 100% { transform: translateX(220%); } }
  @keyframes ccDash { to { stroke-dashoffset: -28; } }
  @keyframes ccBlink { 50% { opacity: 0; } }

  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: rgba(139,109,255,0.3); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(139,109,255,0.5); background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="tg" cx="35%" cy="30%">
        <stop offset="0%" stop-color="#33E1F2" /><stop offset="70%" stop-color="#7C5CFF" />
      </radialGradient>
    </defs>
    <rect width="100" height="100" fill="#08081f" />
    <circle cx="24" cy="40" r="3" fill="#fff" opacity="0.8" />
    <circle cx="78" cy="22" r="2" fill="#fff" opacity="0.7" />
    <circle cx="64" cy="70" r="2.4" fill="#fff" opacity="0.6" />
    <circle cx="50" cy="50" r="18" fill="url(#tg)" />
    <ellipse cx="50" cy="50" rx="30" ry="9" fill="none" stroke="#FFB454" stroke-width="2.4" transform="rotate(-20 50 50)" />
  </svg>
</template>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="cosmic-theme.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="cosmic-parts.jsx"></script>
<script type="text/babel" src="cosmic-chrome.jsx"></script>
<script type="text/babel" src="cosmic-ui.jsx"></script>
<script type="text/babel" src="cosmic-screens.jsx"></script>
<script type="text/babel" src="cosmic-pages1.jsx"></script>
<script type="text/babel" src="cosmic-pages2.jsx"></script>
<script type="text/babel" src="cosmic-pages3.jsx"></script>
<script type="text/babel" src="cosmic-pages4.jsx"></script>
<script type="text/babel" src="cosmic-app.jsx"></script>
</body>
</html>
