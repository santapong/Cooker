name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Run on PRs to main and to any in-flight stacked PR branches
    # under claude/** so each stacked PR in a series gets verified
    # without waiting for the parent to merge first.
    branches:
      - main
      - "claude/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cooker_test
          POSTGRES_USER: cooker
          POSTGRES_PASSWORD: cooker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: gofmt
        working-directory: backend
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "::error::gofmt drift detected in:" >&2
            echo "$drift" >&2
            exit 1
          fi
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        # Keep going to the test step even on lint failure so a single
        # CI cycle surfaces both signals at once. The job still fails
        # overall — golangci-lint-action records it as a failed step.
        continue-on-error: true
        with:
          version: v2.5.0
          working-directory: backend
          args: --timeout=5m
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgres://cooker:cooker@localhost:5432/cooker_test?sslmode=disable
        run: |
          # Run packages one at a time so a failure surfaces the
          # offending package clearly in the action log without
          # having to download the full archive.
          set -e
          fail=0
          for pkg in $(go list ./...); do
            echo "::group::$pkg"
            if ! go test -race -timeout 90s "$pkg"; then
              fail=1
              echo "::error::test failure in $pkg"
            fi
            echo "::endgroup::"
          done
          exit $fail

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm test -- --passWithNoTests

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: helm lint
        run: helm lint deploy/helm/cooker
      - name: helm template (default values)
        run: helm template cooker deploy/helm/cooker > /tmp/default.yaml
      - name: helm template (production with OIDC + ingress + TLS)
        run: |
          helm template cooker deploy/helm/cooker \
            --set cookerEnv=production \
            --set 'oidc.allowedOrigins={https://cooker.example.com}' \
            --set oidc.enabled=true \
            --set oidc.issuerUrl=https://accounts.google.com \
            --set oidc.clientId=test-client \
            --set oidc.clientSecretRef.name=cooker-oidc \
            --set secretKey.existingSecret=cooker-secret-key \
            --set ingress.enabled=true \
            --set 'ingress.tls[0].secretName=cooker-tls' \
            --set 'ingress.tls[0].hosts[0]=cooker.example.com' \
            --set database.host=postgres.cooker.svc.cluster.local \
            --set database.passwordSecretRef.name=cooker-db \
            > /tmp/prod.yaml
          # Confirm sslmode actually rendered into the DATABASE_URL.
          grep -q 'sslmode=require' /tmp/prod.yaml || {
            echo "ERROR: DATABASE_URL did not render with ?sslmode=require" >&2
            grep -n DATABASE_URL /tmp/prod.yaml >&2 || true
            exit 1
          }
      - name: helm template (production+OIDC+ingress without TLS must fail)
        run: |
          # Asserts the fail-guard in templates/ingress.yaml fires when an
          # operator enables ingress in production with OIDC but forgets
          # to provision a TLS certificate. See SECURITY.md > production
          # checklist.
          if helm template cooker deploy/helm/cooker \
            --set cookerEnv=production \
            --set 'oidc.allowedOrigins={https://cooker.example.com}' \
            --set oidc.enabled=true \
            --set oidc.issuerUrl=https://accounts.google.com \
            --set oidc.clientId=test-client \
            --set oidc.clientSecretRef.name=cooker-oidc \
            --set secretKey.existingSecret=cooker-secret-key \
            --set ingress.enabled=true \
            > /tmp/should-fail.yaml 2>/tmp/fail-stderr; then
            echo "ERROR: helm template should have failed but rendered successfully" >&2
            cat /tmp/should-fail.yaml >&2
            exit 1
          fi
          grep -q 'ingress.tls must be set' /tmp/fail-stderr || {
            echo "ERROR: helm failed but not with the expected ingress.tls message:" >&2
            cat /tmp/fail-stderr >&2
            exit 1
          }
      - name: helm template (kaniko builder)
        run: |
          helm template cooker deploy/helm/cooker \
            --set builder.kind=kaniko \
            --set builder.kaniko.contextPVC=cooker-build-context \
            > /tmp/kaniko.yaml
          # docker.sock volume must be absent under kaniko.
          if grep -q 'docker-socket' /tmp/kaniko.yaml; then
            echo "ERROR: docker-socket volume rendered with builder.kind=kaniko" >&2
            grep -n docker-socket /tmp/kaniko.yaml >&2
            exit 1
          fi
          # RBAC must be present.
          grep -q 'kind: Role' /tmp/kaniko.yaml || {
            echo "ERROR: Kaniko Role not rendered" >&2; exit 1; }
          grep -q 'kind: RoleBinding' /tmp/kaniko.yaml || {
            echo "ERROR: Kaniko RoleBinding not rendered" >&2; exit 1; }
          # Buildah env-vars must NOT be present under kaniko.
          if grep -q 'COOKER_BUILDAH_' /tmp/kaniko.yaml; then
            echo "ERROR: COOKER_BUILDAH_* leaked into kaniko render" >&2
            grep -n COOKER_BUILDAH_ /tmp/kaniko.yaml >&2
            exit 1
          fi
      - name: helm template (buildah builder)
        run: |
          helm template cooker deploy/helm/cooker \
            --set builder.kind=buildah \
            --set builder.buildah.contextPVC=cooker-build-context \
            > /tmp/buildah.yaml
          # docker.sock volume must be absent under buildah.
          if grep -q 'docker-socket' /tmp/buildah.yaml; then
            echo "ERROR: docker-socket volume rendered with builder.kind=buildah" >&2
            grep -n docker-socket /tmp/buildah.yaml >&2
            exit 1
          fi
          # Buildah-specific Role + RoleBinding must be present.
          grep -q 'cooker-buildah-builder' /tmp/buildah.yaml || {
            echo "ERROR: Buildah Role/RoleBinding not rendered" >&2; exit 1; }
          # Buildah env-vars must be set.
          grep -q 'COOKER_BUILDER' /tmp/buildah.yaml || {
            echo "ERROR: COOKER_BUILDER env not rendered" >&2; exit 1; }
          grep -q 'COOKER_BUILDAH_IMAGE' /tmp/buildah.yaml || {
            echo "ERROR: COOKER_BUILDAH_IMAGE env not rendered" >&2; exit 1; }
          grep -q 'COOKER_BUILDAH_STORAGE_DRIVER' /tmp/buildah.yaml || {
            echo "ERROR: COOKER_BUILDAH_STORAGE_DRIVER env not rendered" >&2; exit 1; }
          grep -q 'COOKER_BUILDAH_CONTEXT_PVC' /tmp/buildah.yaml || {
            echo "ERROR: COOKER_BUILDAH_CONTEXT_PVC env not rendered" >&2; exit 1; }
          # Kaniko env-vars must NOT leak.
          if grep -q 'COOKER_KANIKO_' /tmp/buildah.yaml; then
            echo "ERROR: COOKER_KANIKO_* leaked into buildah render" >&2
            grep -n COOKER_KANIKO_ /tmp/buildah.yaml >&2
            exit 1
          fi
          # Kaniko-named RBAC must NOT be present.
          if grep -q 'cooker-kaniko-builder' /tmp/buildah.yaml; then
            echo "ERROR: cooker-kaniko-builder RBAC leaked into buildah render" >&2
            exit 1
          fi
      - name: helm template (keepsave secrets backend)
        run: |
          helm template cooker deploy/helm/cooker \
            --set secrets.backend=keepsave \
            --set secrets.keepsave.url=http://keepsave.cooker.svc.cluster.local:8080 \
            --set secrets.keepsave.projectId=cooker-prod \
            --set secrets.keepsave.apiKey.existingSecret=cooker-keepsave \
            > /tmp/keepsave.yaml
          grep -q 'COOKER_SECRETS_BACKEND' /tmp/keepsave.yaml || {
            echo "ERROR: COOKER_SECRETS_BACKEND not rendered" >&2; exit 1; }
          grep -q 'COOKER_SECRETS_KEEPSAVE_URL' /tmp/keepsave.yaml || {
            echo "ERROR: COOKER_SECRETS_KEEPSAVE_URL not rendered" >&2; exit 1; }
          grep -q 'cooker-keepsave' /tmp/keepsave.yaml || {
            echo "ERROR: keepsave api-key secretKeyRef not rendered" >&2; exit 1; }
      - name: helm template (keepsave without secret must fail)
        run: |
          if helm template cooker deploy/helm/cooker \
            --set secrets.backend=keepsave \
            --set secrets.keepsave.url=http://keepsave:8080 \
            --set secrets.keepsave.projectId=p \
            > /tmp/keepsave-fail.yaml 2>/tmp/keepsave-stderr; then
            echo "ERROR: keepsave without apiKey.existingSecret should fail" >&2
            exit 1
          fi
          grep -q 'apiKey.existingSecret is required' /tmp/keepsave-stderr || {
            echo "ERROR: helm failed but not with expected message" >&2
            cat /tmp/keepsave-stderr >&2
            exit 1
          }
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz -o /tmp/kc.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp
          /tmp/kubeconform -strict -summary -ignore-missing-schemas /tmp/default.yaml /tmp/prod.yaml /tmp/kaniko.yaml /tmp/buildah.yaml /tmp/keepsave.yaml

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, helm]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t cooker:ci -f deploy/docker/Dockerfile .
