name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Run on PRs to main and to any in-flight stacked PR branches
    # under claude/** so each stacked PR in a series gets verified
    # without waiting for the parent to merge first.
    branches:
      - main
      - "claude/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cooker_test
          POSTGRES_USER: cooker
          POSTGRES_PASSWORD: cooker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          # cache: true (the default) covers the module download cache
          # ($GOPATH/pkg/mod). The build cache ($GOCACHE) is separate — see
          # the explicit actions/cache step below (P26-05-35).
          cache: true
          cache-dependency-path: backend/go.sum
      # P26-05-35: persist the Go build cache across runs so incremental
      # rebuilds skip the compilation of unchanged packages (kube-client-go,
      # OTel, etc.). Key on go.sum so the cache busts when dependencies
      # change; the restore-keys fallback lets partial cache hits still
      # benefit on dep-only changes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: gofmt
        working-directory: backend
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "::error::gofmt drift detected in:" >&2
            echo "$drift" >&2
            exit 1
          fi
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Guard — no module-tidy in release config
        # The module-tidy command enables all build tags, pulling
        # tailscale.com via the tsnet tag and bumping the Go floor past 1.25
        # (breaks the docker job on golang:1.25-alpine). See CLAUDE.md. This
        # guard fails the PR if it is reintroduced into the goreleaser config
        # or the release workflow. (Scoped to those two files so this guard's
        # own text in ci.yml is not a false positive.)
        run: |
          if grep -rnE 'go[[:space:]]+mod[[:space:]]+tidy' .goreleaser.yaml .github/workflows/release.yml; then
            echo "::error::module-tidy is forbidden (breaks the Go 1.25 docker build). Use 'go get <module>@<version>' or download instead." >&2
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        # Keep going to the test step even on lint failure so a single
        # CI cycle surfaces both signals at once. The job still fails
        # overall — golangci-lint-action records it as a failed step.
        continue-on-error: true
        with:
          version: v2.5.0
          working-directory: backend
          args: --timeout=5m
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgres://cooker:cooker@localhost:5432/cooker_test?sslmode=disable
        run: |
          # Run all packages in one invocation so go test can parallelise
          # across packages (bounded by GOMAXPROCS). The race detector stays
          # on. P26-05-34: replaces the per-package sequential for-loop.
          go test -race -timeout 120s ./...
      - name: govulncheck
        working-directory: backend
        # CWE-1104: surface known-vulnerable dependencies and reachable
        # stdlib symbols (govulncheck is call-graph aware, so it only reports
        # live paths). Run via a pinned 'go run' so it never modifies go.mod —
        # module-tidy is forbidden in this repo (pulls tailscale.com via the
        # tsnet tag and breaks the Go 1.25 docker build; see CLAUDE.md).
        # Advisory (non-blocking): it also reports stdlib CVEs fixed only by
        # newer Go patch releases — a moving frontier that would keep CI red
        # between routine toolchain bumps. Real third-party dep CVEs are still
        # surfaced and fixed by bumping the module (x/crypto, x/net were bumped
        # for GO-2026-501x/5025). Review the output each run.
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: npm audit (production deps, high+)
        working-directory: frontend
        # CWE-1104: fail on a high/critical advisory in a runtime dependency
        # that ships to the browser. Scoped to production deps (--omit=dev) so
        # build-tooling advisories that never reach users don't block a PR.
        run: npm audit --audit-level=high --omit=dev
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm test -- --passWithNoTests

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.0
      - name: helm lint
        run: helm lint deploy/helm/cooker
      - name: helm template (default values)
        run: helm template cooker deploy/helm/cooker > /tmp/default.yaml
      - name: helm template (production with OIDC + ingress + TLS)
        run: |
          helm template cooker deploy/helm/cooker \
            --set cookerEnv=production \
            --set 'oidc.allowedOrigins={https://cooker.example.com}' \
            --set oidc.enabled=true \
            --set oidc.issuerUrl=https://accounts.google.com \
            --set oidc.clientId=test-client \
            --set oidc.clientSecretRef.name=cooker-oidc \
            --set secretKey.existingSecret=cooker-secret-key \
            --set ingress.enabled=true \
            --set 'ingress.tls[0].secretName=cooker-tls' \
            --set 'ingress.tls[0].hosts[0]=cooker.example.com' \
            --set database.host=postgres.cooker.svc.cluster.local \
            --set database.passwordSecretRef.name=cooker-db \
            > /tmp/prod.yaml
          # Confirm sslmode actually rendered into the DATABASE_URL.
          grep -q 'sslmode=require' /tmp/prod.yaml || {
            echo "ERROR: DATABASE_URL did not render with ?sslmode=require" >&2
            grep -n DATABASE_URL /tmp/prod.yaml >&2 || true
            exit 1
          }
      - name: helm template (production+OIDC+ingress without TLS must fail)
        run: |
          # Asserts the fail-guard in templates/ingress.yaml fires when an
          # operator enables ingress in production with OIDC but forgets
          # to provision a TLS certificate. See SECURITY.md > production
          # checklist.
          if helm template cooker deploy/helm/cooker \
            --set cookerEnv=production \
            --set 'oidc.allowedOrigins={https://cooker.example.com}' \
            --set oidc.enabled=true \
            --set oidc.issuerUrl=https://accounts.google.com \
            --set oidc.clientId=test-client \
            --set oidc.clientSecretRef.name=cooker-oidc \
            --set secretKey.existingSecret=cooker-secret-key \
            --set ingress.enabled=true \
            > /tmp/should-fail.yaml 2>/tmp/fail-stderr; then
            echo "ERROR: helm template should have failed but rendered successfully" >&2
            cat /tmp/should-fail.yaml >&2
            exit 1
          fi
          grep -q 'ingress.tls must be set' /tmp/fail-stderr || {
            echo "ERROR: helm failed but not with the expected ingress.tls message:" >&2
            cat /tmp/fail-stderr >&2
            exit 1
          }
      - name: helm template (builder cache)
        run: |
          # Default values: COOKER_BUILD_CACHE_REPO must not render.
          if grep -q 'COOKER_BUILD_CACHE_REPO' /tmp/default.yaml; then
            echo "ERROR: COOKER_BUILD_CACHE_REPO rendered without builder.cache.enabled" >&2
            exit 1
          fi
          helm template cooker deploy/helm/cooker \
            --set builder.cache.enabled=true \
            --set builder.cache.ref=reg.example.com/cooker/buildcache \
            > /tmp/cache.yaml
          grep -q 'COOKER_BUILD_CACHE_REPO' /tmp/cache.yaml || {
            echo "ERROR: COOKER_BUILD_CACHE_REPO did not render with builder.cache.enabled" >&2
            exit 1
          }
          # enabled without ref must fail (required guard).
          if helm template cooker deploy/helm/cooker \
            --set builder.cache.enabled=true \
            > /dev/null 2>&1; then
            echo "ERROR: builder.cache.enabled without ref should fail to render" >&2
            exit 1
          fi
      - name: helm template (kaniko builder)
        run: |
          helm template cooker deploy/helm/cooker \
            --set builder.kind=kaniko \
            --set builder.kaniko.contextPVC=cooker-build-context \
            > /tmp/kaniko.yaml
          # docker.sock volume must be absent under kaniko.
          if grep -q 'docker-socket' /tmp/kaniko.yaml; then
            echo "ERROR: docker-socket volume rendered with builder.kind=kaniko" >&2
            grep -n docker-socket /tmp/kaniko.yaml >&2
            exit 1
          fi
          # RBAC must be present.
          grep -q 'kind: Role' /tmp/kaniko.yaml || {
            echo "ERROR: Kaniko Role not rendered" >&2; exit 1; }
          grep -q 'kind: RoleBinding' /tmp/kaniko.yaml || {
            echo "ERROR: Kaniko RoleBinding not rendered" >&2; exit 1; }
          # Buildah env-vars must NOT be present under kaniko.
          if grep -q 'COOKER_BUILDAH_' /tmp/kaniko.yaml; then
            echo "ERROR: COOKER_BUILDAH_* leaked into kaniko render" >&2
            grep -n COOKER_BUILDAH_ /tmp/kaniko.yaml >&2
            exit 1
          fi
      - name: helm template (buildah builder)
        run: |
          helm template cooker deploy/helm/cooker \
            --set builder.kind=buildah \
            --set builder.buildah.contextPVC=cooker-build-context \
            > /tmp/buildah.yaml
          # docker.sock volume must be absent under buildah.
          if grep -q 'docker-socket' /tmp/buildah.yaml; then
            echo "ERROR: docker-socket volume rendered with builder.kind=buildah" >&2
            grep -n docker-socket /tmp/buildah.yaml >&2
            exit 1
          fi
          # Buildah-specific Role + RoleBinding must be present.
          grep -q 'cooker-buildah-builder' /tmp/buildah.yaml || {
            echo "ERROR: Buildah Role/RoleBinding not rendered" >&2; exit 1; }
          # Buildah env-vars must be set.
          grep -q 'COOKER_BUILDER' /tmp/buildah.yaml || {
            echo "ERROR: COOKER_BUILDER env not rendered" >&2; exit 1; }
          grep -q 'COOKER_BUILDAH_IMAGE' /tmp/buildah.yaml || {
            echo "ERROR: COOKER_BUILDAH_IMAGE env not rendered" >&2; exit 1; }
          grep -q 'COOKER_BUILDAH_STORAGE_DRIVER' /tmp/buildah.yaml || {
            echo "ERROR: COOKER_BUILDAH_STORAGE_DRIVER env not rendered" >&2; exit 1; }
          grep -q 'COOKER_BUILDAH_CONTEXT_PVC' /tmp/buildah.yaml || {
            echo "ERROR: COOKER_BUILDAH_CONTEXT_PVC env not rendered" >&2; exit 1; }
          # Kaniko env-vars must NOT leak.
          if grep -q 'COOKER_KANIKO_' /tmp/buildah.yaml; then
            echo "ERROR: COOKER_KANIKO_* leaked into buildah render" >&2
            grep -n COOKER_KANIKO_ /tmp/buildah.yaml >&2
            exit 1
          fi
          # Kaniko-named RBAC must NOT be present.
          if grep -q 'cooker-kaniko-builder' /tmp/buildah.yaml; then
            echo "ERROR: cooker-kaniko-builder RBAC leaked into buildah render" >&2
            exit 1
          fi
      - name: helm template (retention disabled by default)
        run: |
          helm template cooker deploy/helm/cooker \
            --set database.host=postgres.example.com \
            --set database.passwordSecretRef.name=cooker-db \
            > /tmp/retention-off.yaml
          # CronJob must be absent by default.
          if grep -q 'kind: CronJob' /tmp/retention-off.yaml; then
            echo "ERROR: retention CronJob rendered when retention.enabled=false" >&2
            exit 1
          fi
      - name: helm template (retention enabled)
        run: |
          helm template cooker deploy/helm/cooker \
            --set retention.enabled=true \
            --set retention.daysToKeep=30 \
            --set retention.schedule='15 3 * * *' \
            --set database.host=postgres.example.com \
            --set database.passwordSecretRef.name=cooker-db \
            > /tmp/retention-on.yaml
          grep -q 'kind: CronJob' /tmp/retention-on.yaml || {
            echo "ERROR: retention CronJob not rendered when enabled" >&2; exit 1; }
          grep -q 'cooker-retention' /tmp/retention-on.yaml || {
            echo "ERROR: retention CronJob name not present" >&2; exit 1; }
          grep -q "schedule: \"15 3 \* \* \*\"" /tmp/retention-on.yaml || {
            echo "ERROR: retention.schedule not interpolated" >&2; exit 1; }
          grep -q "INTERVAL '30 days'" /tmp/retention-on.yaml || {
            echo "ERROR: retention.daysToKeep not interpolated into SQL" >&2; exit 1; }
          # Hardening: pod must run non-root with caps dropped.
          grep -q 'runAsNonRoot: true' /tmp/retention-on.yaml || {
            echo "ERROR: retention pod missing runAsNonRoot" >&2; exit 1; }
          grep -q 'drop:' /tmp/retention-on.yaml || {
            echo "ERROR: retention pod missing capability drops" >&2; exit 1; }
      - name: helm template (retention enabled without database.host renders nothing)
        run: |
          helm template cooker deploy/helm/cooker \
            --set retention.enabled=true \
            > /tmp/retention-no-db.yaml
          # Without database.host the chart can't render DATABASE_URL,
          # so the CronJob must skip itself rather than render a broken Job.
          if grep -q 'kind: CronJob' /tmp/retention-no-db.yaml; then
            echo "ERROR: retention CronJob rendered without database.host" >&2
            exit 1
          fi
      - name: helm template (keepsave secrets backend)
        run: |
          helm template cooker deploy/helm/cooker \
            --set secrets.backend=keepsave \
            --set secrets.keepsave.url=http://keepsave.cooker.svc.cluster.local:8080 \
            --set secrets.keepsave.projectId=cooker-prod \
            --set secrets.keepsave.apiKey.existingSecret=cooker-keepsave \
            > /tmp/keepsave.yaml
          grep -q 'COOKER_SECRETS_BACKEND' /tmp/keepsave.yaml || {
            echo "ERROR: COOKER_SECRETS_BACKEND not rendered" >&2; exit 1; }
          grep -q 'COOKER_SECRETS_KEEPSAVE_URL' /tmp/keepsave.yaml || {
            echo "ERROR: COOKER_SECRETS_KEEPSAVE_URL not rendered" >&2; exit 1; }
          grep -q 'cooker-keepsave' /tmp/keepsave.yaml || {
            echo "ERROR: keepsave api-key secretKeyRef not rendered" >&2; exit 1; }
      - name: helm template (keepsave without secret must fail)
        run: |
          if helm template cooker deploy/helm/cooker \
            --set secrets.backend=keepsave \
            --set secrets.keepsave.url=http://keepsave:8080 \
            --set secrets.keepsave.projectId=p \
            > /tmp/keepsave-fail.yaml 2>/tmp/keepsave-stderr; then
            echo "ERROR: keepsave without apiKey.existingSecret should fail" >&2
            exit 1
          fi
          grep -q 'apiKey.existingSecret is required' /tmp/keepsave-stderr || {
            echo "ERROR: helm failed but not with expected message" >&2
            cat /tmp/keepsave-stderr >&2
            exit 1
          }
      - name: helm template (AWS overlays — starter/team/scale)
        run: |
          # Template the chart with each AWS deploy overlay so the overlays
          # in deploy/aws/values/ can't silently rot against chart changes.
          # The overlays deliberately leave per-cluster values empty
          # (database.host, the ACM certificate-arn, oidc.issuerUrl, etc.);
          # CI supplies the minimal --set placeholders here so the chart
          # renders. NOTE: cookerEnv=production + oidc.enabled + ingress.enabled
          # trips the chart's ingress.tls fail-guard
          # (templates/ingress.yaml). On AWS, TLS is terminated at the ALB via
          # an ACM cert, so the overlays carry no ingress.tls — meaning a dummy
          # tls entry must be supplied here to template. This is the documented
          # chart gap (see deploy/aws/values/*.yaml + DEPLOY-AWS-VERCEL.md OPEN
          # list): the prod+OIDC TLS guard doesn't account for ALB-terminated
          # TLS.
          for tier in starter team scale; do
            helm template cooker deploy/helm/cooker \
              -f "deploy/aws/values/values-aws-${tier}.yaml" \
              --set database.host=cooker-pg.example.rds.amazonaws.com \
              --set 'oidc.issuerUrl=https://cognito-idp.ap-southeast-1.amazonaws.com/pool' \
              --set oidc.clientId=ci-client \
              --set 'oidc.redirectUrl=https://cooker.example.com/auth/callback' \
              --set 'oidc.allowedOrigins={https://cooker.example.com}' \
              --set secretKey.existingSecret=cooker-secret-key \
              --set 'ingress.annotations.alb\.ingress\.kubernetes\.io/certificate-arn=arn:aws:acm:ap-southeast-1:000000000000:certificate/ci' \
              --set 'ingress.tls[0].secretName=cooker-alb-placeholder' \
              --set 'ingress.tls[0].hosts[0]=cooker.example.com' \
              > "/tmp/aws-${tier}.yaml"
            # The AWS secrets backend selector must render as "aws".
            grep -q 'COOKER_SECRETS_BACKEND' "/tmp/aws-${tier}.yaml" || {
              echo "ERROR: COOKER_SECRETS_BACKEND not rendered for ${tier}" >&2; exit 1; }
            grep -Eq 'value: *"?aws"?' "/tmp/aws-${tier}.yaml" || {
              echo "ERROR: COOKER_SECRETS_BACKEND value 'aws' not rendered for ${tier}" >&2
              grep -n -A1 COOKER_SECRETS_BACKEND "/tmp/aws-${tier}.yaml" >&2 || true
              exit 1; }
            # The mandatory ALB WS idle-timeout must be present on the Ingress.
            grep -q 'idle_timeout.timeout_seconds=300' "/tmp/aws-${tier}.yaml" || {
              echo "ERROR: ALB idle_timeout=300 annotation not rendered for ${tier}" >&2; exit 1; }
            # OIDC 'groups' scope must NOT leak (Cognito has no groups scope).
            if grep -qiE 'COOKER_OIDC_SCOPES.*groups' "/tmp/aws-${tier}.yaml"; then
              echo "ERROR: 'groups' scope leaked into ${tier} render (Cognito has no groups scope)" >&2
              grep -n -i 'COOKER_OIDC_SCOPES' "/tmp/aws-${tier}.yaml" >&2 || true
              exit 1
            fi
          done
      - name: helm template (metrics + networkPolicy disabled)
        run: |
          # Gate render: the chart must still produce a valid, install-able
          # manifest set with the optional metrics integration and the
          # NetworkPolicy both turned off. Catches templates that assume
          # those toggles are always on (e.g. a dangling selector or a
          # reference to a Service the metrics path would have created).
          helm template cooker deploy/helm/cooker \
            --set metrics.enabled=false \
            --set networkPolicy.enabled=false \
            > /tmp/no-metrics-no-netpol.yaml
          # With both off, neither a NetworkPolicy nor metrics CRDs should
          # appear in the render.
          if grep -q 'kind: NetworkPolicy' /tmp/no-metrics-no-netpol.yaml; then
            echo "ERROR: NetworkPolicy rendered with networkPolicy.enabled=false" >&2
            exit 1
          fi
          if grep -q 'kind: ServiceMonitor' /tmp/no-metrics-no-netpol.yaml; then
            echo "ERROR: ServiceMonitor rendered with metrics.enabled=false" >&2
            exit 1
          fi
          if grep -q 'kind: PrometheusRule' /tmp/no-metrics-no-netpol.yaml; then
            echo "ERROR: PrometheusRule rendered with metrics.enabled=false" >&2
            exit 1
          fi
      - name: helm template (metrics ServiceMonitor + PrometheusRule)
        run: |
          # Gate render: exercise the metrics observability path
          # (ServiceMonitor + PrometheusRule are monitoring.coreos.com
          # CRDs). The positive grep assertions below fail the step if the
          # toggle stops rendering the CRDs, so the gate can't pass
          # vacuously should the metrics gating regress to always-false.
          # kubeconform then validates the rendered CRD instances against
          # the Datree catalog below.
          helm template cooker deploy/helm/cooker \
            --set metrics.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            > /tmp/metrics.yaml
          # Positive assertions: the toggle must actually render the CRDs.
          # Without these the step passes vacuously if the metrics gating
          # ever regresses to always-false (mirrors the retention step's
          # 'kind: CronJob' guard).
          grep -q 'kind: ServiceMonitor' /tmp/metrics.yaml || {
            echo "ERROR: ServiceMonitor not rendered when metrics.serviceMonitor.enabled=true" >&2; exit 1; }
          grep -q 'kind: PrometheusRule' /tmp/metrics.yaml || {
            echo "ERROR: PrometheusRule not rendered when metrics.prometheusRule.enabled=true" >&2; exit 1; }
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz -o /tmp/kc.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp
          # CRD validation: the Datree CRDs-catalog supplies schemas for
          # off-tree CRDs (monitoring.coreos.com ServiceMonitor /
          # PrometheusRule from M0-T1, etc.) keyed by group/kind/version.
          # -ignore-missing-schemas stays as the fallback so a CRD the
          # catalog doesn't carry yields a skip rather than a hard failure
          # — schemas are validated where available, never silently
          # required.
          SCHEMA_LOCATIONS=(
            -schema-location default
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          )
          # Pass 1: every helm render permutation produced above.
          /tmp/kubeconform -strict -summary -ignore-missing-schemas \
            "${SCHEMA_LOCATIONS[@]}" \
            /tmp/default.yaml \
            /tmp/prod.yaml \
            /tmp/kaniko.yaml \
            /tmp/buildah.yaml \
            /tmp/keepsave.yaml \
            /tmp/retention-on.yaml \
            /tmp/no-metrics-no-netpol.yaml \
            /tmp/metrics.yaml \
            /tmp/aws-starter.yaml \
            /tmp/aws-team.yaml \
            /tmp/aws-scale.yaml
          # Pass 2: the raw manifests under deploy/kubernetes/ (parity set
          # for non-Helm users). These can drift from the chart, so they
          # get their own kubeconform pass with the same schema locations.
          /tmp/kubeconform -strict -summary -ignore-missing-schemas \
            "${SCHEMA_LOCATIONS[@]}" \
            deploy/kubernetes/

  docker:
    # P26-05-38: drop needs:[backend,frontend,helm] so the docker build runs
    # in parallel with the test jobs rather than after them. The docker job
    # has no genuine data dependency on test output — it only needs a clean
    # checkout. Failing fast on a Dockerfile syntax error is now possible
    # without waiting for the full test suite to complete.
    #
    # There is one acknowledged trade-off: compute is spent on a docker build
    # even when tests are failing. On a branch where tests are red the build
    # will waste a few minutes; this is acceptable because it surfaces
    # independent failure signals in parallel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # P26-05-39: set up buildx with the GHA layer-cache backend so
      # subsequent runs reuse cached layers for the Go build, npm ci, and
      # kubectl fetch stages.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: cooker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min
