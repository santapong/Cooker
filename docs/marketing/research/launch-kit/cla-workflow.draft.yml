# DRAFT — NOT ACTIVATED. Move to .github/workflows/dco.yml to enable the DCO sign-off check.
# Fails the PR check if any commit in the PR lacks a valid `Signed-off-by` trailer.
# See docs/marketing/research/launch-kit/cla-setup.md for the DCO-vs-CLA decision.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on all PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%(trailers:key=Signed-off-by)' "$sha" | grep -q "$author"; then
              echo "::error::commit $sha is missing a matching 'Signed-off-by: $author' (run: git commit -s)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more commits lack a DCO sign-off. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits carry a DCO sign-off."
