<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 292" width="984" height="292" role="img" aria-labelledby="title desc">
<title id="title">Cooker stage types</title><desc id="desc">Build cube, Test flask, Push upload, Deploy rocket, Approval diamond with check, and Custom terminal. These are the application&#x27;s actual stage symbols.</desc>
<rect width="984" height="292" rx="18" fill="#0b0b0c"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" font-size="15" fill="#e07a1f" letter-spacing="2">COOKER / STAGE TYPES</text><text x="32" y="79" font-size="25" fill="#f2f2f0" >Recognise the action before reading the label.</text><rect x="32" y="105" width="140" height="122" rx="10" fill="#141416" stroke="#333336"/><g transform="translate(84 125) scale(2)" fill="none" stroke="#e07a1f" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="m9 1.5 6.5 3.7v7.6L9 16.5l-6.5-3.7V5.2z" /><path d="m2.5 5.2 6.5 4 6.5-4M9 9.2v7.3M5.8 3.4l6.5 3.8" /></g><text x="102" y="204" font-size="19" fill="#f2f2f0" text-anchor="middle">Build</text><rect x="188" y="105" width="140" height="122" rx="10" fill="#141416" stroke="#333336"/><g transform="translate(240 125) scale(2)" fill="none" stroke="#e07a1f" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h6M7 2v5l-4.5 6.5A1.5 1.5 0 0 0 3.8 16h10.4a1.5 1.5 0 0 0 1.3-2.5L11 7V2M5 10h8" /><path d="m7 13 1.5 1.5L11 12" /></g><text x="258" y="204" font-size="19" fill="#f2f2f0" text-anchor="middle">Test</text><rect x="344" y="105" width="140" height="122" rx="10" fill="#141416" stroke="#333336"/><g transform="translate(396 125) scale(2)" fill="none" stroke="#e07a1f" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12V2m-4 4 4-4 4 4M3 11v5h12v-5" /><path d="M6 16h6" /></g><text x="414" y="204" font-size="19" fill="#f2f2f0" text-anchor="middle">Push</text><rect x="500" y="105" width="140" height="122" rx="10" fill="#141416" stroke="#333336"/><g transform="translate(552 125) scale(2)" fill="none" stroke="#e07a1f" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12c0-5 4-9 10-10 0 6-4 10-9 10zM6 7H3l-1 5h4m5 0v3l-5 1v-4M4 14l-2 2" /><circle cx="12" cy="6" r="1.5" /></g><text x="570" y="204" font-size="19" fill="#f2f2f0" text-anchor="middle">Deploy</text><rect x="656" y="105" width="140" height="122" rx="10" fill="#141416" stroke="#333336"/><g transform="translate(708 125) scale(2)" fill="none" stroke="#e07a1f" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="m9 1 8 8-8 8-8-8z" /><path d="m5.5 9 2.3 2.3 4.7-4.6" /></g><text x="726" y="204" font-size="19" fill="#f2f2f0" text-anchor="middle">Approval</text><rect x="812" y="105" width="140" height="122" rx="10" fill="#141416" stroke="#333336"/><g transform="translate(864 125) scale(2)" fill="none" stroke="#e07a1f" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="15" height="13" rx="2" /><path d="m5 6 3 3-3 3m5 0h3" /></g><text x="882" y="204" font-size="19" fill="#f2f2f0" text-anchor="middle">Custom</text><text x="32" y="266" font-size="17" fill="#a3a39c" >Shape identifies the stage. Colour stays available for run status.</text></g>
</svg>
