<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 336" width="1152" height="336" role="img" aria-labelledby="title desc">
<title id="title">Five-step GitHub Compose import</title><desc id="desc">Repository selection, ordered Compose files, read-only preview, destination and database binding, then saved review. Deployment is a separate action from the App page.</desc>
<rect width="1152" height="336" rx="18" fill="#0b0b0c"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" font-size="15" fill="#e07a1f" letter-spacing="2">COOKER / COMPOSE IMPORT</text><text x="32" y="78" font-size="25" fill="#f2f2f0" >One reviewed revision, from repository to runtime.</text><rect x="32" y="109" width="200" height="151" rx="10" fill="#141416" stroke="#333336"/><text x="48" y="140" font-size="16" fill="#e07a1f" >01</text><text x="48" y="178" font-size="23" fill="#f2f2f0" >Repository</text><text x="48" y="213" font-size="14" fill="#a3a39c" >GitHub App or public</text><text x="48" y="238" font-size="14" fill="#a3a39c" >Choose branch or tag</text><path d="M234 183h16m-5-5 5 5-5 5" fill="none" stroke="#e07a1f" stroke-width="1.5"/><rect x="254" y="109" width="200" height="151" rx="10" fill="#141416" stroke="#333336"/><text x="270" y="140" font-size="16" fill="#e07a1f" >02</text><text x="270" y="178" font-size="23" fill="#f2f2f0" >Compose files</text><text x="270" y="213" font-size="14" fill="#a3a39c" >Base + ordered overrides</text><text x="270" y="238" font-size="14" fill="#a3a39c" >Profiles and inputs</text><path d="M456 183h16m-5-5 5 5-5 5" fill="none" stroke="#e07a1f" stroke-width="1.5"/><rect x="476" y="109" width="200" height="151" rx="10" fill="#141416" stroke="#333336"/><text x="492" y="140" font-size="16" fill="#e07a1f" >03</text><text x="492" y="178" font-size="23" fill="#f2f2f0" >Preview</text><text x="492" y="213" font-size="14" fill="#a3a39c" >Services + Dockerfiles</text><text x="492" y="238" font-size="14" fill="#a3a39c" >Inspect before execution</text><path d="M678 183h16m-5-5 5 5-5 5" fill="none" stroke="#e07a1f" stroke-width="1.5"/><rect x="698" y="109" width="200" height="151" rx="10" fill="#141416" stroke="#333336"/><text x="714" y="140" font-size="16" fill="#e07a1f" >04</text><text x="714" y="178" font-size="23" fill="#f2f2f0" >Destination</text><text x="714" y="213" font-size="14" fill="#a3a39c" >Prefix, target, registry</text><text x="714" y="238" font-size="14" fill="#a3a39c" >Optional database binding</text><path d="M900 183h16m-5-5 5 5-5 5" fill="none" stroke="#e07a1f" stroke-width="1.5"/><rect x="920" y="109" width="200" height="151" rx="10" fill="#141416" stroke="#333336"/><text x="936" y="140" font-size="16" fill="#e07a1f" >05</text><text x="936" y="178" font-size="23" fill="#f2f2f0" >Review</text><text x="936" y="213" font-size="14" fill="#a3a39c" >Check the pinned SHA</text><text x="936" y="238" font-size="14" fill="#a3a39c" >Save, then deploy</text><text x="32" y="304" font-size="18" fill="#a3a39c" >Preview is read-only. Deploy from the App page after saving the review.</text></g>
</svg>
