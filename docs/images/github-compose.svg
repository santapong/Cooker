<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 548" width="1152" height="548" role="img" aria-labelledby="title desc">
<title id="title">Cooker · GitHub to ECS with an external database</title><desc id="desc">GitHub Compose source is inspected at a pinned SHA, saved and deployed through Docker build and an image registry to existing ECS Fargate infrastructure. The workload connects to existing GCP Cloud SQL using operator-provided access. This is an implementation illustration, not live cloud acceptance evidence.</desc>
<rect width="1152" height="548" rx="18" fill="#0b0b0c"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" font-size="15" fill="#e07a1f" letter-spacing="2">COOKER / REVIEWED DEPLOYMENT</text><text x="32" y="78" font-size="25" fill="#f2f2f0" >GitHub source. AWS compute. An existing GCP database.</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#e07a1f"/></marker></defs><rect x="32" y="112" width="288" height="100" rx="10" fill="#141416" stroke="#4a4036"/><text x="52" y="141" font-size="12" fill="#e07a1f" letter-spacing="1.4">EXTERNAL</text><text x="52" y="169" font-size="22" fill="#f2f2f0" >GitHub repository</text><text x="52" y="194" font-size="16" fill="#a3a39c" >Compose + Dockerfiles</text><rect x="432" y="112" width="288" height="100" rx="10" fill="#141416" stroke="#4a4036"/><text x="452" y="141" font-size="12" fill="#e07a1f" letter-spacing="1.4">FRONTEND</text><text x="452" y="169" font-size="22" fill="#f2f2f0" >Cooker review</text><text x="452" y="194" font-size="16" fill="#a3a39c" >Files · prefix · bindings</text><rect x="832" y="112" width="288" height="100" rx="10" fill="#141416" stroke="#4a4036"/><text x="852" y="141" font-size="12" fill="#e07a1f" letter-spacing="1.4">BACKEND</text><text x="852" y="169" font-size="22" fill="#f2f2f0" >Docker build</text><text x="852" y="194" font-size="16" fill="#a3a39c" >Pinned source checkout</text><rect x="832" y="336" width="288" height="100" rx="10" fill="#141416" stroke="#4a4036"/><text x="852" y="365" font-size="12" fill="#e07a1f" letter-spacing="1.4">EXTERNAL</text><text x="852" y="393" font-size="22" fill="#f2f2f0" >Image registry</text><text x="852" y="418" font-size="16" fill="#a3a39c" >Workload can pull images</text><rect x="432" y="336" width="288" height="100" rx="10" fill="#141416" stroke="#4a4036"/><text x="452" y="365" font-size="12" fill="#e07a1f" letter-spacing="1.4">CLOUD</text><text x="452" y="393" font-size="22" fill="#f2f2f0" >AWS ECS Fargate</text><text x="452" y="418" font-size="16" fill="#a3a39c" >Existing cluster + network</text><rect x="32" y="336" width="288" height="100" rx="10" fill="#141416" stroke="#4a4036"/><text x="52" y="365" font-size="12" fill="#e07a1f" letter-spacing="1.4">DATABASE</text><text x="52" y="393" font-size="22" fill="#f2f2f0" >GCP Cloud SQL</text><text x="52" y="418" font-size="16" fill="#a3a39c" >Existing database</text><path d="M320 162 L432 162" stroke="#e07a1f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376.0" y="151" font-size="14" fill="#a3a39c" text-anchor="middle">inspect SHA</text><path d="M720 162 L832 162" stroke="#e07a1f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="776.0" y="151" font-size="14" fill="#a3a39c" text-anchor="middle">save + deploy</text><path d="M976 212 L976 336" stroke="#e07a1f" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="916" y="251.0" width="120" height="24" rx="4" fill="#0b0b0c"/><text x="976" y="267.0" font-size="14" fill="#a3a39c" text-anchor="middle">push image</text><path d="M832 386 L720 386" stroke="#e07a1f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="776.0" y="375" font-size="14" fill="#a3a39c" text-anchor="middle">image pull</text><path d="M432 386 L320 386" stroke="#e07a1f" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="376.0" y="375" font-size="14" fill="#a3a39c" text-anchor="middle">app connection</text><text x="32" y="480" font-size="19" fill="#f2f2f0" >Cooker deploys the application. The operator provides infrastructure and database access.</text><text x="32" y="512" font-size="17" fill="#a3a39c" >Source builds: dev/UAT only. Live GitHub and AWS-to-GCP acceptance remain pending.</text></g>
</svg>
