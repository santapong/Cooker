<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooker — Porthole mockup</title>
<style>
  :root {
    --void:#050506; --hull-0:#0b0b0c; --hull-1:#141416;
    --line:rgba(255,255,255,.10);
    --ink-1:#f2f2f0; --ink-2:#a3a39c; --ink-3:#66665f;
    --star-idle:#d6d6d0; --star-running:#E07A1F; --star-ok:#7ee2a8;
    --star-fail:#ff6b7a; --star-queued:#66665f; --ember:#E07A1F;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--hull-0); color:var(--ink-1);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:grid; grid-template-columns:64px 1fr; grid-template-rows:48px 1fr;
    overflow:hidden;
  }
  .caps { text-transform:uppercase; letter-spacing:.08em; font-size:12px; color:var(--ink-3); }

  /* ── instrument rail ── */
  nav {
    grid-row:1/3; border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:18px;
  }
  .logo { width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--ember), #4a2a10 65%, transparent 70%); margin-bottom:10px; }
  .ni { width:28px; height:28px; border-radius:8px; position:relative; opacity:.45; transition:opacity 120ms cubic-bezier(.2,0,0,1); }
  .ni svg { position:absolute; inset:5px; stroke:var(--ink-2); fill:none; stroke-width:1.5; }
  .ni.active { opacity:1; }
  .ni.active::before { content:""; position:absolute; left:-18px; top:11px; width:5px; height:5px;
    border-radius:50%; background:var(--ember); box-shadow:0 0 8px 1px var(--ember); }
  .gap { height:6px; border-bottom:1px solid var(--line); width:28px; }

  /* ── top strip ── */
  header {
    display:flex; align-items:center; gap:14px; padding:0 24px; border-bottom:1px solid var(--line);
  }
  header .crumb { color:var(--ink-2); font-size:13px; }
  header .crumb b { color:var(--ink-1); font-weight:600; }
  header .spacer { flex:1; }
  .badge { font-size:11px; letter-spacing:.06em; padding:3px 9px; border:1px solid var(--line);
    border-radius:999px; color:var(--ink-3); }
  .badge.run { color:var(--star-running); border-color:rgba(224,122,31,.40); }

  /* ── porthole ── */
  main { position:relative; padding:20px 24px 24px; display:flex; flex-direction:column; min-height:0; }
  .porthole {
    position:relative; flex:1; border-radius:24px; overflow:hidden;
    background:
      radial-gradient(900px 500px at 78% 18%, rgba(255,255,255,.035), transparent 60%),
      radial-gradient(700px 450px at 15% 85%, rgba(224,122,31,.04), transparent 60%),
      var(--void);
    border:1px solid var(--line);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), inset 0 0 80px rgba(0,0,0,.9);
  }
  .bracket { position:absolute; width:18px; height:18px; border-color:rgba(255,255,255,.35); border-style:solid; border-width:0; z-index:5; }
  .bracket.tl { top:10px; left:10px;  border-top-width:1px; border-left-width:1px; }
  .bracket.tr { top:10px; right:10px; border-top-width:1px; border-right-width:1px; }
  .bracket.bl { bottom:10px; left:10px;  border-bottom-width:1px; border-left-width:1px; }
  .bracket.br { bottom:10px; right:10px; border-bottom-width:1px; border-right-width:1px; }
  .hud { position:absolute; z-index:5; }
  .hud.tl { top:18px; left:26px; }
  .hud.tr { top:18px; right:26px; text-align:right; font-family:ui-monospace,monospace; font-size:12px; color:var(--ink-3); }
  .hud.tr b { color:var(--ink-2); font-weight:500; }

  /* starfield layers (transform-only drift) */
  .field { position:absolute; inset:-200px; z-index:1; }
  .f1 { animation:drift1 240s linear infinite; }
  .f2 { animation:drift2 360s linear infinite; }
  @keyframes drift1 { to { transform:translate(-120px,60px); } }
  @keyframes drift2 { to { transform:translate(80px,-40px); } }
  .dot { position:absolute; border-radius:50%; background:#d6d6d0; }
  .tw { animation:twinkle 9s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:.35; } 50% { opacity:.8; } }

  /* constellation */
  .scene { position:absolute; inset:0; z-index:3; }
  svg.edges { position:absolute; inset:0; width:100%; height:100%; }
  svg.edges path { fill:none; stroke:rgba(255,255,255,.22); stroke-width:1.5; }
  svg.edges path.done { stroke:rgba(126,226,168,.45); }
  svg.edges path.hot  { stroke:rgba(224,122,31,.65); }
  body.anim svg.edges path { stroke-dasharray:600; stroke-dashoffset:600;
    animation:draw 320ms cubic-bezier(.2,0,0,1) forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }

  .star { position:absolute; width:48px; height:48px; transform:translate(-50%,-50%); }
  .halo { position:absolute; inset:0; border-radius:50%; opacity:.55;
    background:radial-gradient(circle, rgba(214,214,208,.5), rgba(214,214,208,.12) 45%, transparent 70%); }
  .core { position:absolute; left:50%; top:50%; width:6px; height:6px; transform:translate(-50%,-50%);
    border-radius:50%; background:var(--star-idle); }
  .lbl { position:absolute; top:52px; left:50%; transform:translateX(-50%); white-space:nowrap;
    font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2); }
  .sub { position:absolute; top:68px; left:50%; transform:translateX(-50%); white-space:nowrap;
    font-family:ui-monospace,monospace; font-size:10px; color:var(--ink-3); }
  .star.ok   .core { background:var(--star-ok); }
  .star.ok   .halo { background:radial-gradient(circle, rgba(126,226,168,.55), rgba(126,226,168,.12) 45%, transparent 70%); }
  .star.run  .core { background:var(--star-running); }
  .star.run  .halo { background:radial-gradient(circle, rgba(224,122,31,.70), rgba(224,122,31,.16) 45%, transparent 70%);
    animation:pulse 1600ms ease-in-out infinite; }
  .star.q    .core { background:var(--star-queued); }
  .star.q    .halo { opacity:.22; }
  .star.q    .lbl  { color:var(--ink-3); }
  @keyframes pulse { 0%,100% { opacity:.6; transform:scale(1); } 50% { opacity:1; transform:scale(1.15); } }

  .comet { position:absolute; width:5px; height:5px; border-radius:50%; z-index:4;
    background:var(--star-running); box-shadow:0 0 10px 2px rgba(224,122,31,.85);
    offset-rotate:0deg; offset-distance:55%; }
  body.anim .comet { animation:fly 1200ms ease-in-out infinite; }
  @keyframes fly { from { offset-distance:0%; } to { offset-distance:100%; } }

  /* tool tray + console */
  .tray { position:absolute; z-index:5; left:50%; bottom:132px; transform:translateX(-50%);
    display:flex; gap:6px; padding:7px 10px; border:1px solid var(--line); border-radius:999px;
    background:rgba(11,11,12,.72); backdrop-filter:blur(4px); }
  .chip { font-size:11px; letter-spacing:.07em; color:var(--ink-2); padding:4px 11px;
    border-radius:999px; transition:background 120ms cubic-bezier(.2,0,0,1); }
  .chip:hover { background:var(--hull-1); }
  .console { position:absolute; z-index:5; left:0; right:0; bottom:0; height:112px;
    border-top:1px solid var(--line); background:rgba(5,5,6,.85); backdrop-filter:blur(3px);
    padding:10px 26px; font-family:ui-monospace,monospace; font-size:12px; color:var(--ink-2); }
  .console .caps { margin-bottom:6px; }
  .ln { display:flex; gap:14px; line-height:1.7; }
  .ln .t { color:var(--ink-3); }
  .ln.hot { color:var(--star-running); }
  .ln.ok .m::before { content:"✓ "; color:var(--star-ok); }

  /* calm + reduced motion: substitute, don't delete */
  @media (prefers-reduced-motion: reduce) {
    .f1,.f2,.tw { animation:none; }
    svg.edges path { animation:none; stroke-dashoffset:0; }
    .comet { animation:none; offset-distance:35%; }
    .star.run .halo { animation:rpulse 2s ease-in-out infinite; }
    @keyframes rpulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }
  }
</style>
</head>
<body>
  <nav>
    <div class="logo"></div>
    <div class="ni active" title="Pipelines"><svg viewBox="0 0 18 18"><circle cx="4" cy="9" r="2"/><circle cx="14" cy="4" r="2"/><circle cx="14" cy="14" r="2"/><path d="M6 8l6-3M6 10l6 3"/></svg></div>
    <div class="ni"><svg viewBox="0 0 18 18"><rect x="3" y="3" width="12" height="12" rx="2"/></svg></div>
    <div class="ni"><svg viewBox="0 0 18 18"><path d="M3 13h12M5 13V8m4 5V5m4 8v-3"/></svg></div>
    <div class="gap"></div>
    <div class="ni"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6"/><path d="M9 3v12"/></svg></div>
    <div class="ni"><svg viewBox="0 0 18 18"><path d="M4 4h10v10H4z M4 9h10"/></svg></div>
  </nav>

  <header>
    <span class="crumb">Pipelines / <b>deploy-web</b></span>
    <span class="badge run">RUN #148 · RUNNING</span>
    <span class="spacer"></span>
    <span class="badge">CALM MODE</span>
    <span class="badge">v0.2.0</span>
  </header>

  <main>
    <div class="porthole">
      <div class="field f1" id="f1"></div>
      <div class="field f2" id="f2"></div>

      <div class="bracket tl"></div><div class="bracket tr"></div>
      <div class="bracket bl"></div><div class="bracket br"></div>
      <div class="hud tl caps">Porthole · Deploy-Web</div>
      <div class="hud tr"><b>02:41</b> elapsed<br>stage 4 / 6</div>

      <div class="scene" id="scene">
        <svg class="edges" id="edges"></svg>
      </div>

      <div class="tray">
        <span class="chip">＋ Build</span><span class="chip">＋ Test</span>
        <span class="chip">＋ Scan</span><span class="chip">＋ Push</span>
        <span class="chip">＋ Deploy</span>
      </div>

      <div class="console">
        <div class="caps">Telemetry</div>
        <div class="ln ok"><span class="t">04:36:02</span><span class="m">scan — 0 critical, 2 low (trivy)</span></div>
        <div class="ln hot"><span class="t">04:36:41</span><span class="m">test — running k6 smoke suite… 62%</span></div>
      </div>
    </div>
  </main>

<script>
  // starfield
  function field(el, n, sMin, sMax) {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (Math.random() < .18 ? ' tw' : '');
      const s = (sMin + Math.random() * (sMax - sMin)).toFixed(1);
      d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;opacity:${(.15+Math.random()*.5).toFixed(2)}`;
      if (d.className.includes('tw')) d.style.animationDelay = (Math.random()*9).toFixed(1)+'s';
      frag.appendChild(d);
    }
    el.appendChild(frag);
  }
  field(document.getElementById('f1'), 90, 1, 1.6);
  field(document.getElementById('f2'), 50, 1.6, 2.4);

  // constellation — positions in fractions of the scene
  const stages = [
    { id:'checkout', x:.11, y:.42, st:'ok',  sub:'12s'  },
    { id:'build',    x:.30, y:.24, st:'ok',  sub:'1m04' },
    { id:'scan',     x:.30, y:.62, st:'ok',  sub:'38s'  },
    { id:'test',     x:.52, y:.40, st:'run', sub:'02:41' },
    { id:'push',     x:.72, y:.26, st:'q',   sub:'ghcr' },
    { id:'deploy',   x:.89, y:.46, st:'q',   sub:'k8s'  },
  ];
  const links = [
    ['checkout','build','done'], ['checkout','scan','done'],
    ['build','test','done'], ['scan','test','hot'],
    ['test','push',''], ['push','deploy',''],
  ];
  const scene = document.getElementById('scene');
  const svg = document.getElementById('edges');
  const W = scene.clientWidth || 1352, H = scene.clientHeight || 690;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const P = Object.fromEntries(stages.map(s => [s.id, [s.x*W, s.y*H]]));

  let hotPath = null;
  links.forEach(([a,b,cls], i) => {
    const [x1,y1] = P[a], [x2,y2] = P[b];
    const mx = (x1+x2)/2, my = (y1+y2)/2 - 18;
    const d = `M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', d);
    if (cls) p.setAttribute('class', cls);
    p.style.animationDelay = (120 + i*40) + 'ms';
    svg.appendChild(p);
    if (cls === 'hot') hotPath = d;
  });

  stages.forEach(s => {
    const el = document.createElement('div');
    el.className = 'star ' + s.st;
    el.style.left = (s.x*100) + '%';
    el.style.top  = (s.y*100) + '%';
    el.innerHTML = `<div class="halo"></div><div class="core"></div>
      <div class="lbl">${s.id}</div><div class="sub">${s.sub}</div>`;
    scene.appendChild(el);
  });

  if (hotPath) {
    const c = document.createElement('div');
    c.className = 'comet';
    c.style.offsetPath = `path('${hotPath}')`;
    scene.appendChild(c);
  }
  // gate entrance/loop animations so the resting state is complete without them
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches
      && !location.search.includes('static')) {
    requestAnimationFrame(() => document.body.classList.add('anim'));
  }
</script>
</body>
</html>
