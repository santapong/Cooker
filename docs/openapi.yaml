openapi: 3.1.0
info:
  title: Cooker API
  description: |
    CI/CD management tool API. Visual pipeline builder for OCI image
    build → registry push → Kubernetes deploy across user-defined ordered
    environments (e.g. Dev/Staging/Production).

    **Authentication:** All `/api/v1/*` routes require a Bearer token
    (OIDC access token or local-auth JWT) unless `security: []` is noted.
    WebSocket connections use single-use tickets from
    `POST /api/v1/ws-tickets`.

    **Authorization:** mutating routes require a role. `operator` or `admin`
    for writes; `admin` (often + MFA) for destructive and secret operations;
    `approver` for promotion approval. Roles are summarised per-operation via
    the `x-required-role` extension and in the human-readable reference at
    `docs/system-design/14-api-reference.md`.

    **Errors:** all error responses use `{ "error": "message" }`.

    **Source of truth:** this spec is hand-maintained to mirror
    `backend/internal/server/router.go`. The `swaggo/swag`-generated spec at
    `backend/docs/api/swagger.{json,yaml}` is generated from doc-comments and
    annotates flagship endpoints.
  version: "1.1.0"
servers:
  - url: http://localhost:8080
    description: Local dev
  - url: /
    description: Same-origin (production single-binary)
tags:
  - name: meta
    description: Health, version, metrics
  - name: auth
    description: Authentication and auth-method discovery
  - name: pipelines
    description: Pipeline CRUD and validation
  - name: runs
    description: Pipeline runs, logs, promotion
  - name: apps
    description: Application build/deploy
  - name: environments
    description: Environments and ordered promotion
  - name: secrets
    description: Per-environment secrets
  - name: docker
    description: Docker images, containers, networks, volumes, compose
  - name: kubernetes
    description: Kubernetes workloads and manifests
  - name: registry
    description: OCI registry reads and push/pull
  - name: hosts
    description: Registered hosts
  - name: templates
    description: Pipeline template catalog
  - name: settings
    description: Registry and cluster configuration
  - name: tokens
    description: API tokens (personal access / service-account bearer tokens)
  - name: admin
    description: Admin-only catalog CRUD (admin + MFA)
  - name: webhooks
    description: Git provider webhook receivers (unauthenticated, HMAC-verified)
  - name: websocket
    description: Real-time streaming (ticket-gated)
paths:
  # ----------------------------------------------------------------- meta
  /health:
    get:
      summary: Liveness probe
      tags: [meta]
      security: []
      responses:
        "200": { description: Service is alive }
  /health/live:
    get:
      summary: Liveness probe
      tags: [meta]
      security: []
      responses:
        "200": { description: Service is alive }
  /health/ready:
    get:
      summary: Readiness probe (checks store/redis)
      tags: [meta]
      security: []
      responses:
        "200": { description: Service is ready }
        "503": { description: A dependency is not ready }
  /version:
    get:
      summary: Build version info
      tags: [meta]
      security: []
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
  /metrics:
    get:
      summary: Prometheus metrics (currently unauthenticated)
      tags: [meta]
      security: []
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain: {}

  # ----------------------------------------------------------------- auth
  /api/v1/auth/methods:
    get:
      summary: Discover enabled auth methods
      tags: [auth]
      security: []
      responses:
        "200":
          description: Which auth modes are enabled (OIDC / local)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMethods" }
  /api/v1/auth/local/signup:
    post:
      summary: Local-auth signup (only when local auth enabled)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalCredentials" }
      responses:
        "201": { description: User created }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/local/signin:
    post:
      summary: Local-auth signin → JWT
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalCredentials" }
      responses:
        "200":
          description: Issued token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/local/me:
    get:
      summary: Current local-auth user
      tags: [auth]
      responses:
        "200":
          description: Current user claims
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --------------------------------------------------------------- tokens
  /api/v1/tokens:
    get:
      summary: List API tokens
      description: >
        Returns the caller's own tokens. An admin may pass `?all=true` to
        list every token. The SHA-256 hash and the plaintext are never
        returned — only metadata (name, display prefix, role, timestamps).
      tags: [tokens]
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: boolean }
          description: Admin-only. List every token instead of just the caller's.
      responses:
        "200":
          description: Tokens visible to the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/APIToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Non-admin requested all=true }
    post:
      summary: Create an API token
      description: >
        Mints a long-lived bearer token (`ck_…`). The plaintext is returned
        exactly once in this response and is unrecoverable afterward — only
        its SHA-256 hash is stored. The role is capped at the caller's own
        role. A request authenticated **by** a token may not create tokens
        (no self-replication).
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name:
                  type: string
                  description: Operator-supplied label, e.g. "ci-deploy".
                role:
                  type: string
                  enum: [admin, operator, approver, viewer]
                  description: Role the token authenticates as; must be ≤ the caller's own role.
                expiresAt:
                  type: string
                  format: date-time
                  description: Optional RFC3339 expiry. Omitted = never expires (short expiries recommended for CI).
      responses:
        "201":
          description: Created. `token` is the plaintext, shown only here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The plaintext credential (`ck_…`). Shown exactly once.
                  apiToken: { $ref: "#/components/schemas/APIToken" }
        "400": { description: Unknown role, missing name, or expiry in the past }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Requested role exceeds caller's role, or caller is token-authenticated }
  /api/v1/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    delete:
      summary: Revoke an API token
      description: >
        Deletes the token row — revocation is immediate (the next
        authenticated use fails). A non-admin may delete only their own
        tokens; targeting another user's token returns 404 so ids cannot be
        probed. An admin deleting another user's token is MFA-gated when MFA
        is configured. A token-authenticated request may not delete tokens.
      tags: [tokens]
      responses:
        "200": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Token-authenticated caller, or admin without required MFA }
        "404": { description: Token not found (or not owned by a non-admin caller) }

  # ------------------------------------------------------------ pipelines
  /api/v1/pipelines:
    get:
      summary: List pipelines
      tags: [pipelines]
      responses:
        "200":
          description: Array of pipelines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pipeline" }
    post:
      summary: Create a pipeline
      tags: [pipelines]
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pipeline" }
      responses:
        "201":
          description: Created pipeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pipelines/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      summary: Get a pipeline by ID
      tags: [pipelines]
      responses:
        "200":
          description: A pipeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update a pipeline (optimistic concurrency)
      tags: [pipelines]
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pipeline" }
      responses:
        "200":
          description: Updated pipeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Delete a pipeline (admin + MFA)
      tags: [pipelines]
      x-required-role: admin
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pipelines/{id}/validate:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      summary: Validate a pipeline DAG (cycle/type check)
      tags: [pipelines]
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pipelines/from-template/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      summary: Create a pipeline from a catalog template
      tags: [pipelines, templates]
      x-required-role: operator
      responses:
        "201":
          description: Created pipeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pipelines/import:
    post:
      summary: Import a pipeline from a YAML document (pipeline-as-code)
      description: |
        Creates a NEW pipeline from a `cooker.dev/v1` `Pipeline` YAML
        envelope (the same document `GET /pipelines/{id}/export` produces).
        The body is the raw YAML (Content-Type `application/yaml`), not a
        JSON wrapper. A fresh ID and timestamps are always minted, so
        importing the same document twice yields two pipelines (there is
        no name-collision handling — create has none).

        The parsed pipeline runs the identical validation path as a JSON
        create: an unknown `apiVersion`/`kind`, malformed YAML, an empty
        body, an invalid stage type, or a graph that fails DAG validation
        all return 400. A DAG failure returns the same
        `{ "valid": false, "errors": [...] }` envelope as `POST /validate`.
      tags: [pipelines]
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              description: A cooker.dev/v1 Pipeline YAML document.
      responses:
        "201":
          description: Created pipeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "400":
          description: Malformed/unknown envelope or failing validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: Pipeline document exceeds the 1 MiB import cap }
  /api/v1/pipelines/{id}/export:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      summary: Export a pipeline as a YAML document (pipeline-as-code)
      description: |
        Returns the pipeline as a `cooker.dev/v1` `Pipeline` YAML
        envelope (`apiVersion`/`kind`/`metadata`/`spec`). Server-assigned
        fields (id, timestamps, version) are stripped so the document is
        portable and version-controllable; re-importing regenerates them.
        Secret VALUES never appear — only `secretRefs` (names). The
        response carries a `Content-Disposition` filename suggestion
        (`<name>.cooker.yaml`). Read-level access, same as GET pipeline.
      tags: [pipelines]
      responses:
        "200":
          description: Pipeline-as-code YAML document
          content:
            application/yaml:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------------- runs
  /api/v1/pipelines/{id}/run:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      summary: Trigger a pipeline run
      description: Rate-limited (expensive). Returns 202 immediately; tail progress over WebSocket.
      tags: [runs]
      x-required-role: operator
      responses:
        "202":
          description: Run accepted (async)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineRun" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/pipelines/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      summary: List runs for a pipeline
      description: >-
        Returns run summaries newest-first. Per-stage `logs` are omitted
        from list responses — fetch a single run (or the stage-logs
        endpoint) for full logs. Malformed `limit`/`offset` values fall
        back to their defaults rather than erroring.
      tags: [runs]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
          description: Page size, clamped to [1, 200].
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
          description: Number of newest runs to skip.
      responses:
        "200":
          description: Array of run summaries (per-stage logs omitted)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PipelineRun" }
  /api/v1/pipelines/{id}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Get a run by ID
      tags: [runs]
      responses:
        "200":
          description: A run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pipelines/{id}/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/RunId"
    post:
      summary: Cancel a running run
      tags: [runs]
      x-required-role: operator
      responses:
        "200": { description: Cancellation requested }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pipelines/{id}/runs/{runId}/diff:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: runId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Diff a run against a baseline (default last successful prior run)
      tags: [runs]
      parameters:
        - name: against
          in: query
          schema: { type: string }
          description: Baseline runId, or "last-success" (default).
      responses:
        "200":
          description: >-
            Per-stage status/duration/digest deltas + variables diff +
            definition-version delta. When no baseline exists the body
            carries {"reason": "no successful prior run"} instead.
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pipelines/{id}/analytics:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      summary: Stage-duration + success-rate analytics from run history
      tags: [pipelines]
      parameters:
        - name: runs
          in: query
          schema: { type: integer, default: 30, maximum: 200 }
      responses:
        "200":
          description: Per-stage p50/p95/avg durations, success rates, per-run series
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pipelines/{id}/runs/{runId}/stages/{stageId}/triage:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: runId
        in: path
        required: true
        schema: { type: string }
      - name: stageId
        in: path
        required: true
        schema: { type: string }
    post:
      summary: AI failure triage for a failed stage (opt-in, advisory only)
      description: >-
        Sends the failed stage's sanitized config summary, error and log
        tail (last 32 KiB) to the configured Anthropic model and returns
        an advisory explanation. Requires COOKER_AI_TRIAGE_ENABLED=true +
        ANTHROPIC_API_KEY server-side; the key never reaches clients.
        Secrets (env values, secretRefs values) are stripped from the
        prompt. Rate-limited (paid upstream call).
      tags: [runs]
      x-required-role: operator
      responses:
        "200":
          description: Advisory
          content:
            application/json:
              schema:
                type: object
                properties:
                  advisory: { type: string }
                  model: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Stage is not failed
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: AI triage not enabled on this deployment
  /api/v1/capabilities:
    get:
      summary: Optional-feature discovery for the frontend
      tags: [settings]
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiTriage: { type: boolean }
  /api/v1/pipelines/{id}/runs/{runId}/logs/{stageId}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/RunId"
      - name: stageId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Final logs for a stage (REST snapshot)
      tags: [runs]
      responses:
        "200":
          description: Stage logs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageLogs" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pipelines/{id}/runs/{runId}/promote:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/RunId"
    post:
      summary: Promote a run to the next environment
      tags: [runs, environments]
      x-required-role: operator
      responses:
        "200":
          description: Promotion result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pipelines/{id}/runs/{runId}/approve:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/RunId"
    post:
      summary: Approve a manual promotion gate
      description: Requires the `approver` role (and possibly MFA).
      tags: [runs, environments]
      x-required-role: approver
      responses:
        "200": { description: Approval recorded }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pipelines/{id}/runs/{runId}/env-status:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Per-environment status of a run
      tags: [runs, environments]
      responses:
        "200":
          description: Per-environment statuses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnvironmentStatus" }

  # ----------------------------------------------------------------- apps
  /api/v1/apps:
    get:
      summary: List apps
      tags: [apps]
      responses:
        "200":
          description: Array of apps
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/App" }
    post:
      summary: Create an app
      tags: [apps]
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/App" }
      responses:
        "201":
          description: Created app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/apps/detect-build:
    post:
      summary: Detect a repo's build plan + suggested wizard recipe (pre-import)
      description: >-
        Shallow-clones the repo and runs the same build-plan detection an
        App deploy would, plus a recipe heuristic for the New-App wizard.
        Rate-limited (network-bound). Clone failures (private repo, typo,
        unreachable remote) return 422 with the reason.
      tags: [apps]
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [githubRepo]
              properties:
                githubRepo: { type: string, example: octocat/Hello-World }
                branch: { type: string, example: main }
      responses:
        "200":
          description: Detected plan and suggested recipe
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: object
                    properties:
                      kind: { type: string, enum: [dockerfile, compose, buildpack] }
                      path: { type: string }
                  suggestedRecipe: { type: string, enum: [go, node-static, worker] }
        "400":
          description: Malformed repo or branch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Clone failed (private/unreachable/nonexistent repo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Detection not available on this deployment
  /api/v1/apps/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      summary: Get an app
      tags: [apps]
      responses:
        "200":
          description: An app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update an app
      tags: [apps]
      x-required-role: operator
      responses:
        "200":
          description: Updated app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete an app (admin + MFA)
      tags: [apps]
      x-required-role: admin
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/apps/{id}/deploy:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      summary: Deploy an app (build → push → deploy)
      description: Rate-limited and subject to the governance admission hook. Returns 202.
      tags: [apps]
      x-required-role: operator
      responses:
        "202":
          description: Deploy accepted (async)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineRun" }
        "403": { description: Forbidden or denied by governance hook }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: Governance hook unavailable (fail-closed env) }
  /api/v1/apps/{id}/deploys:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      summary: Per-app deploy/rollback history, newest first
      tags: [apps]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: History rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  deploys:
                    type: array
                    items: { $ref: "#/components/schemas/AppDeploy" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/apps/{id}/rollback:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      summary: Re-deploy a previously shipped image (deploy-only, no rebuild)
      description: >-
        v1 supports kubernetes deploy targets and single-image history
        rows. Default target is the second most-recent successful
        deploy; pass deployId to pick an explicit row. Same rate-limit,
        idempotency and governance gates as deploy.
      tags: [apps]
      x-required-role: operator
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deployId: { type: string }
      responses:
        "202":
          description: Rollback accepted; stream via /ws/app-run/{runId}
        "404":
          description: App not found, or no earlier successful deploy
        "409":
          description: Unsupported target (non-kubernetes) or non-rollbackable row
  /api/v1/apps/{id}/drift:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      summary: Compare the last shipped image to the live cluster workload
      tags: [apps]
      x-required-role: operator
      responses:
        "200":
          description: Drift verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [in_sync, drift, unknown, unsupported] }
                  expectedImage: { type: string }
                  liveImage: { type: string }
                  message: { type: string }
                  checkedAt: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
