      security: []
      responses:
        "101": { description: Switching Protocols (WebSocket) }
        "401": { description: Missing or invalid ticket }
  /ws/kubernetes/watch:
    parameters:
      - name: namespace
        in: query
        required: false
        schema: { type: string }
      - name: resource
        in: query
        required: false
        schema: { type: string }
      - $ref: "#/components/parameters/Ticket"
    get:
      summary: Stream Kubernetes resource changes (WebSocket upgrade)
      tags: [websocket]
      security: []
      responses:
        "101": { description: Switching Protocols (WebSocket) }
        "401": { description: Missing or invalid ticket }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    Namespace:
      name: ns
      in: path
      required: true
      schema: { type: string }
    Kind:
      name: kind
      in: path
      required: true
      schema: { type: string }
    Name:
      name: name
      in: path
      required: true
      schema: { type: string }
    Ticket:
      name: ticket
      in: query
      required: true
      schema: { type: string }
      description: Single-use WebSocket ticket from POST /api/v1/ws-tickets
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
  schemas:
    VersionInfo:
      type: object
      properties:
        version: { type: string }
        commit: { type: string }
        date: { type: string }
    AuthMethods:
      type: object
      properties:
        oidc: { type: boolean }
        local: { type: boolean }
    LocalCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string }
    UserInfo:
      type: object
      properties:
        subject: { type: string }
        roles:
          type: array
          items: { type: string }
    APIToken:
      type: object
      description: >
        Metadata for a personal-access / service-account token. The plaintext
        and the SHA-256 hash are NEVER present in any response — the plaintext
        is returned once at creation under a separate `token` field, and the
        hash is server-only.
      properties:
        id: { type: string }
        name:
          type: string
          description: Operator-supplied label.
        displayPrefix:
          type: string
          description: First 12 chars of the plaintext (e.g. "ck_AbCd1234"); identifies a token without revealing it.
        role:
          type: string
          enum: [admin, operator, approver, viewer]
        createdBySub: { type: string }
        createdByEmail: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Null/omitted = never expires.
        lastUsedAt:
          type: string
          format: date-time
          description: Most recent authenticated use (throttled to ≤ 1 write/min/token). Null = never used.
    Pipeline:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        runDeadline:
          type: string
          description: >-
            Per-pipeline run deadline override (Go duration, e.g. "45m").
            Empty uses the cluster default (COOKER_RUN_DEADLINE). Validated
            to [10s, 24h].
        stages:
          type: array
          items: { $ref: "#/components/schemas/Stage" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/Edge" }
    Stage:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [build, test, deploy, push, approval, custom, gitops-commit]
        config:
          type: object
          additionalProperties: true
          properties:
            retry:
              type: object
              description: >-
                Structured per-stage retry policy. Wins over the legacy
                integer `retries`. Clamped server-side (maxAttempts <= 10,
                delays within [100ms, 5m]); exponential=false pins every
                delay to initialMs.
              properties:
                maxAttempts: { type: integer, minimum: 0, maximum: 10 }
                initialMs: { type: integer, minimum: 0, maximum: 60000 }
                maxMs: { type: integer, minimum: 0, maximum: 300000 }
                exponential: { type: boolean }
            cache:
              type: object
              description: >-
                Build-stage layer cache. mode registry/oci requires ref —
                a registry image ref the builder pushes and pulls layer
                cache through (Kaniko --cache-repo, Buildah --cache-from/to,
                BuildKit cache import/export). Omitted or disabled means
                cold builds. Refs are validated server-side (strict
                registry-ref grammar).
              properties:
                mode: { type: string, enum: [registry, oci, disabled] }
                ref: { type: string }
                inline: { type: boolean, description: BuildKit-only mode=max cache export }
    AppDeploy:
      type: object
      properties:
        id: { type: string }
        appId: { type: string }
        runId: { type: string }
        pipelineId: { type: string }
        imageRef: { type: string, description: Empty for compose multi-image deploys }
        digest: { type: string }
        status: { type: string }
        kind: { type: string, enum: [deploy, rollback] }
        createdAt: { type: string }
    Edge:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        condition:
          type: string
          enum: [success, failure, always]
          description: >-
            Evaluated per edge against the upstream stage's terminal status
            (empty means success). Joins AND across incoming edges; a
            skipped upstream propagates skip except through "always".
    PipelineRun:
      type: object
      properties:
        id: { type: string }
        pipelineId: { type: string }
        pipelineVersion:
          type: integer
          description: Pipeline.Version at run creation (0 = unknown, pre-017 rows).
        status:
          type: string
          enum: [pending, running, success, failed, cancelled]
        stageRuns:
          type: array
          items: { $ref: "#/components/schemas/StageRun" }
    StageRun:
      type: object
      properties:
        stageId: { type: string }
        status:
          type: string
          enum: [pending, running, success, failed, cancelled, skipped]
        startedAt: { type: string }
        finishedAt: { type: string }
        logs: { type: string }
    StageLogs:
      type: object
      properties:
        stageId: { type: string }
        logs: { type: string }
    ValidationResult:
      type: object
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
    Environment:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        order: { type: integer }
        target: { $ref: "#/components/schemas/EnvironmentTarget" }
        promotionPolicy: { $ref: "#/components/schemas/PromotionPolicy" }
    EnvironmentTarget:
      type: object
      properties:
        type:
          type: string
          enum: [cluster, namespace]
        clusterId: { type: string }
        namespace: { type: string }
        kubeContext: { type: string }
    EnvironmentStatus:
      type: object
      properties:
        environmentId: { type: string }
        status:
          type: string
          enum: [pending, deploying, deployed, failed, awaiting_approval]
    PromotionPolicy:
      type: object
      properties:
        strategy:
          type: string
          enum: [auto, manual]
        requiredApprovers: { type: integer }
        autoPromoteOn:
          type: array
          items: { type: string }
    App:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        repo: { type: string }
        version: { type: integer }
        buildPlan:
          type: string
          enum: [dockerfile, compose, buildpack]
        deployTarget:
          type: object
          additionalProperties: true
    Host:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
    ComposeGraph:
      type: object
      properties:
        services:
          type: array
          items:
            type: object
            additionalProperties: true
        connections:
          type: array
          items:
            type: object
            additionalProperties: true
    SecretValue:
      type: object
      properties:
        value: { type: string }
    WsTicket:
      type: object
      properties:
        ticket: { type: string }
        expires_at: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Version conflict (optimistic concurrency)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but lacking the required role / MFA
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying
security:
  - bearerAuth: []
