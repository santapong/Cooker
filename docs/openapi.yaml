openapi: 3.1.0
info:
  title: Cooker API
  version: 0.2.0
  summary: CI/CD orchestration over OCI registries, Docker daemons, and Kubernetes clusters.
  description: |
    Cooker's REST surface. This document is hand-maintained and
    intentionally a sketch — it documents the resource shapes and
    auth model so operators can drive Cooker from outside the UI.
    A full generated spec (via `swaggo/swag` from Go source comments)
    is tracked as backlog item P8 OpenAPI.

    All endpoints under `/api/v1` require a valid OIDC bearer token
    in `Authorization: Bearer <token>` unless explicitly noted.
    The `/health` endpoint is unauthenticated. The
    `/webhooks/github` endpoint is authenticated by HMAC, not by
    OIDC.

  contact:
    name: Cooker
    url: https://github.com/santapong/cooker

servers:
  - url: https://cooker.example.com
    description: Production
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Used for the GitHub webhook HMAC and (future) machine clients.

  schemas:
    Pipeline:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        graph:
          type: object
          description: React-Flow node + edge document. Validated server-side.
        environments:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    PipelineRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    Environment:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: prod }
        order: { type: integer, example: 3, description: "1=Dev, 2=Staging, 3=Prod" }
        target:
          type: object
          properties:
            type: { type: string, enum: [cluster, namespace] }
            clusterId: { type: string }
            namespace: { type: string }
            kubeContext: { type: string }
        promotion:
          type: object
          properties:
            strategy: { type: string, enum: [auto, manual] }
            requiredApprovers: { type: integer }
        plainVars:
          type: object
          additionalProperties: { type: string }
        secretKeys:
          type: array
          items: { type: string }
          description: Names only; values are never returned in this response.
    App:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        githubRepo: { type: string, example: acme/web }
        branch: { type: string, default: main }
        autoDeploy: { type: boolean }
        hasWebhook: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

paths:
  /health:
    get:
      summary: Liveness probe.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: cooker }

  /api/v1/pipelines:
    get:
      summary: List pipelines.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pipeline' }
    post:
      summary: Create a pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pipeline' }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Pipeline' } } }

  /api/v1/pipelines/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get one pipeline.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pipeline' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      summary: Update a pipeline.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Pipeline' } } }
      responses:
        '200': { description: OK }
    delete:
      summary: Delete a pipeline.
      responses:
        '200': { description: Deleted }
        '404': { description: Not found }

  /api/v1/pipelines/{id}/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Trigger a pipeline run.
      responses:
        '202':
          description: Run queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRun' }

  /api/v1/pipelines/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List runs for a pipeline.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PipelineRun' }

  /api/v1/pipelines/{id}/runs/{runId}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Cancel a running pipeline run.
      responses:
        '200': { description: Cancelled }

  /api/v1/pipelines/{id}/runs/{runId}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Approve a manual promotion gate. Requires admin or approver role.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200': { description: Approved }
        '403': { description: Insufficient role }

  /api/v1/environments:
    get:
      summary: List environments (secrets redacted).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Environment' }
    post:
      summary: Create an environment. Secrets cannot be set here — use the dedicated /secrets endpoint.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Environment' } } }
      responses:
        '201': { description: Created }

  /api/v1/environments/{id}/secrets/{key}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: key, in: path, required: true, schema: { type: string, example: DB_PASSWORD } }
    put:
      summary: Set or rotate a single secret. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        '200': { description: Stored }
        '403': { description: Admin role required }
        '503':
          description: Secrets backend unavailable. For COOKER_SECRETS_BACKEND=database, COOKER_SECRET_KEY is unset; for keepsave, the upstream is unreachable.
    get:
      summary: Reveal the plaintext value. Admin only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  value: { type: string }
        '403': { description: Admin role required }
        '404': { description: Secret not found on this environment }
    delete:
      summary: Delete a secret. Admin only.
      responses:
        '200': { description: Deleted }
        '403': { description: Admin role required }

  /api/v1/apps:
    get:
      summary: List apps (webhook secret redacted).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/App' }
    post:
      summary: Create an app.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/App' } } }
      responses:
        '201': { description: Created }

  /api/v1/apps/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Update an app.
      responses:
        '200': { description: OK }
    delete:
      summary: Delete an app.
      responses:
        '200': { description: Deleted }

  /api/v1/apps/{id}/webhook:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Rotate the GitHub webhook HMAC secret. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string }
      responses:
        '200': { description: Rotated }
        '403': { description: Admin role required }

  /api/v1/apps/{id}/deploy:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Trigger a Clone -> Build -> Push -> Deploy run for the app.
      responses:
        '202':
          description: Run queued; subscribe to the returned `stream` URL for live logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  appId: { type: string }
                  runId: { type: string }
                  channel: { type: string, example: app-run:<runId> }
                  stream: { type: string, example: /ws/app-run/<runId> }

  /webhooks/github:
    post:
      summary: GitHub push-event webhook. HMAC-authenticated; not OIDC.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub push event payload (subset).
      responses:
        '202': { description: Deploy queued for matching app+branch }
        '204': { description: No matching app — silently dropped }
        '401': { description: Bad HMAC signature }
        '403': { description: Webhook not configured for this app }
