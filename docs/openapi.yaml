  /api/v1/settings/secrets/test:
    post:
      summary: Probe secrets-backend connectivity (admin + MFA)
      description: >
        Runs a lightweight authenticated read (List) against the configured
        secrets backend and classifies the outcome. Reveals only the backend
        kind, reachability, latency, and a classified error — never key names
        or values. Probe failure is reported in the 200 body, not as an HTTP
        error.
      tags: [settings]
      x-required-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                environmentId:
                  type: string
                  description: Environment to probe; defaults to the first environment.
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                type: object
                required: [backend, ok, latencyMs]
                properties:
                  backend: { type: string, example: keepsave }
                  ok: { type: boolean }
                  latencyMs: { type: integer }
                  error: { type: string, description: Present when ok=false. }
        "409": { description: No environments exist and none was specified }
        "503": { description: No secrets backend configured }

