  /api/v1/admin/audit:
    get:
      summary: Query the audit trail (admin + MFA)
      description: >
        Queryable audit events written by the db audit sink
        (COOKER_AUDIT_DESTINATION includes "db"). Filters are conjunctive.
        Newest first. Bodies are never captured, so none are returned.
      tags: [admin]
      x-required-role: admin
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339 lower bound (inclusive).
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339 upper bound (inclusive).
        - name: user
          in: query
          schema: { type: string }
          description: Exact OIDC subject match.
        - name: method
          in: query
          schema: { type: string, example: POST }
          description: Exact HTTP method match.
        - name: path
          in: query
          schema: { type: string, example: /api/v1/apps }
          description: Route-path prefix match (literal, LIKE-escaped).
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: One page of audit events
          content:
            application/json:
              schema:
                type: object
                required: [events, limit, offset]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        time: { type: string, format: date-time }
                        userSub: { type: string }
                        userEmail: { type: string }
                        method: { type: string }
                        path: { type: string }
                        status: { type: integer }
                        latencyMs: { type: integer, format: int64 }
                        clientIp: { type: string }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { description: Malformed filter (non-RFC3339 time, bad limit/offset) }
        "503": { description: Audit store not configured }

