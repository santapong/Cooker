# DEV ONLY — this compose file is for local development iteration.
# It is NOT suitable for production or UAT use. For UAT, use
# docker-compose.uat.yml (make uat-up). For production, use the
# Helm chart at deploy/helm/cooker/ or the raw manifests at
# deploy/kubernetes/.
#
# L (broken compose): the previous version referenced non-existent
# deploy/docker/Dockerfile.frontend and deploy/docker/Dockerfile.backend.
# Both services now use the single multi-stage deploy/docker/Dockerfile,
# which produces one binary + static bundle. Hot-reload for frontend
# development is better served by running `cd frontend && npm run dev`
# directly (see CLAUDE.md "Alternative: run from source").
#
# NOTE: /var/run/docker.sock is NOT bind-mounted here. If you need
# docker-in-docker for local build tests, use make uat-up instead
# (which explicitly documents the docker.sock mount and its rationale).

services:
  cooker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://cooker:cooker@postgres:5432/cooker?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - COOKER_PORT=8080
      - COOKER_OIDC_ENABLED=false
      - COOKER_ENV=dev
      - COOKER_BUILDER=noop
      - COOKER_PUSHER=noop
      - COOKER_DEPLOYER=noop
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cooker
      POSTGRES_USER: cooker
      POSTGRES_PASSWORD: cooker  # DEV ONLY — do not copy to production
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # M (dev compose): bind to loopback only so the DB is not
      # reachable from other hosts on the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cooker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
