<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP fallback for cases where the backend CSP header is
         missing (e.g. static preview, file://). The backend's
         securityHeadersMiddleware sets the canonical policy.
         Design reset (Phase 2): external Google Fonts removed with the
         cosmic theme, so the font-src/style-src remote allowances are
         dropped here too — reinstate them if the redesign adds web fonts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Cooker — build, ship, run</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
