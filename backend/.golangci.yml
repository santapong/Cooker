# golangci-lint config for the cooker backend.
#
# Conservative initial set: linters that catch real defects without
# producing churn from style preferences. Tighten over time as the
# codebase stabilizes — adding new linters tends to surface drive-by
# fixes that drown the actual change in a PR.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck       # unchecked errors
    - govet          # parity with `go vet` (go vet is also run separately)
    - ineffassign    # ineffective assignments
    - staticcheck    # static analysis (SA*, ST*, S*) — strictly opt-in below
    - unused         # dead code
    - gosimple       # simplifications
    - bodyclose      # http.Response.Body must be closed
    - misspell       # common misspellings
    - unconvert      # redundant type conversions

linters-settings:
  staticcheck:
    checks:
      - all
      # SA1019 is "deprecated symbols" — too noisy until the kubernetes
      # SDKs are updated; flag in a follow-up PR.
      - "-SA1019"
  errcheck:
    # Allow ignoring the return of fmt.Fprintf to stderr and similar.
    exclude-functions:
      - fmt.Fprintln
      - fmt.Fprintf
      - (io.Closer).Close
      - (*os.File).Close

issues:
  exclude-rules:
    # Test helpers may legitimately leave bodies / errors unchecked
    # for setup/teardown convenience.
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
  max-issues-per-linter: 0
  max-same-issues: 0
