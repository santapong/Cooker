# Production single-host stack — `make deploy-docker` (LIGHT edition base).
#
# This is the "docker mode" easy deploy: Cooker split into separate
# services on one host, with a production posture that passes
# Config.Validate():
#
#   - COOKER_ENV=production (strict validation on).
#   - Bundled PostgreSQL with TLS (self-signed), so the app can reach it
#     at host `postgres` over sslmode=require without you provisioning a
#     database. Certs are generated once by the pg-cert-init one-shot.
#   - Local auth enabled with a generated JWT signing key, so first run
#     has a real login (sign up at /signup) rather than the dev-admin
#     injection that COOKER_ENV=production forbids.
#   - Postgres is NOT published to the host — only the app's 8080.
#
# EDITIONS. This base file is the LIGHT edition: single replica,
# in-memory ws-hub/ws-ticket/rate-limit backends (no Redis container),
# jobqueue/scheduler/metrics/tracing off. The FULL edition layers
# docker-compose.full.yml on top (adds Redis + switches the backends)
# and flips the feature env vars via deploy/editions/full.env.example:
#
#   make deploy-docker-light   # this file only
#   make deploy-docker-full    # + docker-compose.full.yml overlay
#
# Every edition knob below is ${VAR:-default} so the generated .env.prod
# (see the deploy-docker* Makefile targets) controls the posture without
# editing this file.
#
# Secrets (POSTGRES_PASSWORD, COOKER_SECRET_KEY,
# COOKER_LOCAL_AUTH_JWT_SIGNING_KEY) are read from .env.prod, which the
# Makefile generates with fresh random values on first run.
#
# Image builds: COOKER_BUILDER defaults to noop because no in-container
# build path is production-safe on a single host — production forbids the
# docker-socket builder (RCE-to-host). To build images, point Cooker at a
# Kubernetes cluster (COOKER_BUILDER=kaniko + a mounted kubeconfig) or use
# the UAT socket-proxy stack for non-production testing. The crane pusher
# (default here) needs no socket and pushes to COOKER_REGISTRY.

name: cooker

services:
  # One-shot: generate a self-signed TLS cert for Postgres into a shared
  # volume so the app can require encryption (sslmode=require) to a
  # non-localhost DB host, which production validation mandates. Follows
  # the same init-container idiom as the UAT kubeconfig-fixer. Postgres
  # refuses to start unless the key is owned by its user (uid 70 in the
  # alpine image) and not group/world readable.
  pg-cert-init:
    image: alpine:3.19
    command:
      - sh
      - -ec
      - |
        if [ ! -f /certs/server.key ]; then
          apk add --no-cache openssl >/dev/null
          openssl req -new -x509 -days 3650 -nodes -text \
            -subj "/CN=cooker-postgres" \
            -out /certs/server.crt -keyout /certs/server.key
        fi
        chown 70:70 /certs/server.crt /certs/server.key
        chmod 600 /certs/server.key
        chmod 644 /certs/server.crt
    volumes:
      - pgcerts:/certs

  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    environment:
      POSTGRES_DB: cooker
      POSTGRES_USER: cooker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod (make deploy-docker generates it)}
    volumes:
      - pg-prod:/var/lib/postgresql/data
      - pgcerts:/certs:ro
    depends_on:
      pg-cert-init:
        condition: service_completed_successfully
    # No host port: the DB is reachable only on the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cooker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cooker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      COOKER_ENV: production
      COOKER_PORT: "8080"
      # sslmode=require encrypts to the bundled Postgres without cert
      # verification — appropriate for a self-signed cert on a trusted
      # internal network, and what production validation demands for a
      # non-localhost host.
      DATABASE_URL: postgres://cooker:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/cooker?sslmode=require
      # LIGHT default: in-memory single-replica backends, no Redis.
      # The full overlay (docker-compose.full.yml) switches these to
      # redis and adds the Redis service.
      COOKER_WS_HUB_BACKEND: ${COOKER_WS_HUB_BACKEND:-memory}
      COOKER_WS_TICKET_BACKEND: ${COOKER_WS_TICKET_BACKEND:-memory}
      COOKER_RATE_LIMIT_BACKEND: ${COOKER_RATE_LIMIT_BACKEND:-memory}
      COOKER_SECRET_KEY: ${COOKER_SECRET_KEY:?set COOKER_SECRET_KEY in .env.prod}
      # Served origin(s). Override in .env.prod when you front Cooker with
      # a domain / reverse proxy — production rejects "*" and empty.
      COOKER_ALLOWED_ORIGINS: ${COOKER_ALLOWED_ORIGINS:-http://localhost:8080}
      # First-run auth: local accounts. Sign up at /signup; the first
      # user should be promoted to admin out-of-band. Swap for OIDC by
      # setting COOKER_OIDC_* in .env.prod and disabling local auth.
      COOKER_LOCAL_AUTH_ENABLED: "true"
      COOKER_LOCAL_AUTH_JWT_SIGNING_KEY: ${COOKER_LOCAL_AUTH_JWT_SIGNING_KEY:?set COOKER_LOCAL_AUTH_JWT_SIGNING_KEY in .env.prod}
      # Pluggable backends — safe defaults for a single host. Override to
      # wire real builds/deploys (see the header comment).
      COOKER_BUILDER: ${COOKER_BUILDER:-noop}
      COOKER_PUSHER: ${COOKER_PUSHER:-crane}
      COOKER_DEPLOYER: ${COOKER_DEPLOYER:-noop}
      COOKER_REGISTRY: ${COOKER_REGISTRY:-localhost:5000/cooker}
      # ---- Edition feature knobs (all off in LIGHT; the full preset in
      # deploy/editions/full.env.example flips them) --------------------
      COOKER_JOBQUEUE_ENABLED: ${COOKER_JOBQUEUE_ENABLED:-false}
      COOKER_JOBQUEUE_WORKERS: ${COOKER_JOBQUEUE_WORKERS:-4}
      COOKER_SCHEDULER_ENABLED: ${COOKER_SCHEDULER_ENABLED:-false}
      COOKER_METRICS_ENABLED: ${COOKER_METRICS_ENABLED:-false}
      COOKER_TRACING_ENABLED: ${COOKER_TRACING_ENABLED:-false}
      COOKER_AUDIT_DESTINATION: ${COOKER_AUDIT_DESTINATION:-stdout}
      COOKER_AUDIT_DB_RETENTION: ${COOKER_AUDIT_DB_RETENTION:-2160h}
      COOKER_APP_HEALTH_INTERVAL: ${COOKER_APP_HEALTH_INTERVAL:-30s}
      COOKER_AI_TRIAGE_ENABLED: ${COOKER_AI_TRIAGE_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COOKER_FEEDBACK_GITHUB_TOKEN: ${COOKER_FEEDBACK_GITHUB_TOKEN:-}
      COOKER_CLOUD_AWS_ENABLED: ${COOKER_CLOUD_AWS_ENABLED:-false}
      COOKER_CLOUD_AWS_REGION: ${COOKER_CLOUD_AWS_REGION:-}
      COOKER_CLOUD_GCP_ENABLED: ${COOKER_CLOUD_GCP_ENABLED:-false}
      COOKER_CLOUD_GCP_PROJECT_ID: ${COOKER_CLOUD_GCP_PROJECT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-prod:
  pgcerts:
