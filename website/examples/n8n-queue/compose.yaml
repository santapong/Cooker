# Isolated local queue-mode example; not a production deployment profile.
x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_SECURE_COOKIE: "false" # Loopback HTTP test only; use HTTPS in a real installation.
  N8N_RUNNERS_ENABLED: "false" # This smoke workflow contains no Code nodes.
  N8N_DEFAULT_BINARY_DATA_MODE: default
  GENERIC_TIMEZONE: Asia/Bangkok
  TZ: Asia/Bangkok
  N8N_LOG_LEVEL: debug
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
  n8n-main:
    image: ${N8N_IMAGE:?Set a pinned N8N_IMAGE}
    environment:
      <<: *n8n-env
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://127.0.0.1:${N8N_PORT:-19568}/
    ports:
      - "127.0.0.1:${N8N_PORT:-19568}:5678"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - n8n_main_data:/home/node/.n8n
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 30
    mem_limit: 1536m
  n8n-worker:
    image: ${N8N_IMAGE:?Set a pinned N8N_IMAGE}
    command: [worker, --concurrency=5]
    environment:
      <<: *n8n-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      n8n-main: {condition: service_healthy}
    volumes:
      - n8n_worker_data:/home/node/.n8n
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 30
    mem_limit: 1536m
networks:
  default:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
  n8n_main_data:
  n8n_worker_data:
